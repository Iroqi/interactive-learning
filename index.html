<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交互式学习库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050507;
      --bg-card: #0d0d12;
      --bg-elevated: #131318;
      --text: #d6ffe0;
      --text-secondary: #9fcca9;
      --text-muted: #5f7a66;
      --accent: #00ff41;
      --accent-dim: rgba(0, 255, 65, 0.12);
      --border: #1a2a20;
      --border-hover: #2a4a35;
      --devops: #00ff41;
      --cs: #00ff41;
      --automation: #00ff41;
      --tools: #00ff41;
      --font-display: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Consolas, 'PingFang SC', 'Microsoft YaHei', monospace;
      --font-body: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace;
    }

    /* ── Light theme（il_theme=light / 系统亮色） ── */
    html[data-theme="light"] {
      --bg: #f5f6f8;
      --bg-card: #ffffff;
      --bg-elevated: #eef0f4;
      --text: #1b2230;
      --text-secondary: #5b6472;
      --text-muted: #9aa1ad;
      --accent: #008f45;
      --accent-dim: rgba(0, 143, 69, 0.10);
      --border: #e2e6ec;
      --border-hover: #c9d0db;
    }
    html[data-theme="light"] body::before { opacity: 0.55; }
    html[data-theme="light"] .card-star:hover { color: #ca8a04; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Atmospheric background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(0, 255, 65, 0.05), transparent),
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(0, 255, 65, 0.04), transparent),
        radial-gradient(ellipse 50% 60% at 50% 100%, rgba(0, 255, 65, 0.03), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .page { position: relative; z-index: 1; }

    /* ── Hero ── */
    .hero {
      padding: 72px 40px 56px;
      text-align: center;
      position: relative;
    }

    .theme-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s, transform 0.15s;
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.06); }
    @media (max-width: 640px) { .theme-btn { top: 16px; right: 16px; } }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.1s forwards;
    }

    .hero-badge::before, .hero-badge::after {
      content: '';
      width: 20px;
      height: 1px;
      background: var(--accent);
      opacity: 0.5;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(40px, 6vw, 62px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 18px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.2s forwards;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--accent);
      font-weight: 600;
    }

    .hero-sub {
      font-size: 17px;
      color: var(--text-secondary);
      max-width: 440px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.3s forwards;
    }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px 40px 0;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.4s forwards;
    }

    .stat { text-align: center; }

    .stat-num {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 600;
      color: var(--accent);
      display: block;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .stat-divider {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }

    /* ── Thin accent line ── */
    .divider-line {
      height: 1px;
      margin: 32px auto 0;
      max-width: 720px;
      background: linear-gradient(90deg, transparent, var(--border), var(--accent-dim), var(--border), transparent);
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 28px 40px 20px;
      flex-wrap: wrap;
      max-width: 1100px;
      margin: 0 auto;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
      max-width: 260px;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 12px;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus {
      border-color: rgba(211, 168, 83, 0.4);
      box-shadow: 0 0 0 3px rgba(211, 168, 83, 0.06);
    }

    .sort-select {
      padding: 9px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.25s;
    }
    .sort-select:hover { border-color: var(--border-hover); }
    .sort-select:focus { border-color: rgba(211, 168, 83, 0.4); }

    .filters { display: flex; gap: 6px; flex-wrap: wrap; }

    .pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-body);
      transition: all 0.25s;
      user-select: none;
    }

    .pill:hover {
      border-color: var(--border-hover);
      background: var(--bg-elevated);
      color: var(--text);
    }

    .pill.active {
      border-color: rgba(211, 168, 83, 0.5);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .pill .count {
      display: inline-block;
      margin-left: 3px;
      font-weight: 400;
      opacity: 0.6;
      font-size: 10px;
    }

    /* ── Grid ── */
    .grid-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 11px 40px 64px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 1000px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .controls, .grid-wrap { padding-left: 24px; padding-right: 24px; }
      .hero { padding-left: 24px; padding-right: 24px; }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .controls, .grid-wrap { padding-left: 16px; padding-right: 16px; }
      .hero { padding-left: 16px; padding-right: 16px; }
      .stats { gap: 24px; }
    }

    /* ── Card ── */
    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px 24px 24px;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(.2,.8,.2,1),
                  border-color 0.35s,
                  box-shadow 0.35s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeUp 0.55s ease forwards;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 2px;
      background: var(--cat-color);
      border-radius: 0 0 2px 2px;
      opacity: 0.5;
      transition: opacity 0.3s, left 0.35s, right 0.35s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      box-shadow:
        0 11px 40px rgba(0,0,0,0.35),
        0 0 0 1px rgba(255,255,255,0.03) inset;
    }

    .card:hover::before {
      left: 0; right: 0;
      opacity: 0.8;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .card-head-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-star {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      color: var(--text-muted);
      opacity: 0.5;
      padding: 0;
      transition: opacity 0.2s, color 0.2s, transform 0.15s;
      position: relative;
      z-index: 2;
    }
    .card-star:hover { opacity: 1; color: #facc15; transform: scale(1.18); }
    .card-star.on { opacity: 1; color: #facc15; }

    .toast-box {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: rgba(20, 24, 34, 0.96);
      border: 1px solid rgba(250, 204, 21, 0.45);
      color: #fde68a;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 999px;
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 5px;
      line-height: 1.4;
    }

    .card-idx {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      color: var(--text-muted);
      opacity: 0.35;
      line-height: 1;
    }

    .card h3 {
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.65;
      flex: 1;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .card-meta {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }

    .card-go {
      font-size: 11px;
      font-weight: 600;
      color: var(--cat-color, var(--accent));
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .card:hover .card-go {
      opacity: 1;
      transform: translateX(0);
    }

    .card-go svg {
      width: 12px;
      height: 12px;
    }

    /* Category colors */
    .card[data-cat="devops"]     { --cat-color: var(--devops); }
    .card[data-cat="cs"]         { --cat-color: var(--cs); }
    .card[data-cat="automation"] { --cat-color: var(--automation); }
    .card[data-cat="tools"]      { --cat-color: var(--tools); }

    .badge[data-b="devops"]     { background: rgba(0,255,65,0.1); color: var(--devops); }
    .badge[data-b="cs"]         { background: rgba(0,255,65,0.1); color: var(--cs); }
    .badge[data-b="automation"] { background: rgba(0,255,65,0.1); color: var(--automation); }
    .badge[data-b="tools"]      { background: rgba(0,255,65,0.1); color: var(--tools); }

    /* ── Continue strip ── */
    .continue-strip {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      background: var(--accent-dim);
      border: 1px solid rgba(211, 168, 83, 0.35);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.25s, transform 0.25s;
    }
    .continue-strip.show { display: flex; }
    .continue-strip:hover { border-color: rgba(211, 168, 83, 0.6); transform: translateY(-1px); }
    .continue-strip .cs-title { font-weight: 700; color: var(--accent); }
    .continue-strip .cs-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
    .continue-strip .cs-go {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; color: var(--accent); white-space: nowrap;
    }
    .continue-strip .cs-go svg { width: 12px; height: 12px; }
    .continue-wrap { padding: 6px 40px 0; }
    @media (max-width: 1000px) { .continue-wrap { padding-left: 24px; padding-right: 24px; } }
    @media (max-width: 640px) { .continue-wrap { padding-left: 16px; padding-right: 16px; } }

    /* ── Review due strip (spaced repetition) ── */
    .review-wrap { padding: 6px 40px 0; }
    .review-strip {
      display: none;
      max-width: 1100px; margin: 0 auto;
      padding: 14px 20px;
      background: rgba(62,206,180,0.09);
      border: 1px solid rgba(62,206,180,0.35);
      border-radius: 12px;
      font-size: 13px; color: var(--text); text-decoration: none;
      align-items: center; justify-content: space-between; gap: 12px;
      transition: border-color 0.25s, transform 0.25s;
    }
    .review-strip.show { display: flex; }
    .review-strip:hover { border-color: rgba(62,206,180,0.65); transform: translateY(-1px); }
    .review-strip .rs-title { font-weight: 700; color: var(--devops); }
    .review-strip .rs-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
    .review-strip .rs-go {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; color: var(--devops); white-space: nowrap;
    }
    .review-strip .rs-go svg { width: 12px; height: 12px; }
    @media (max-width: 1000px) { .review-wrap { padding-left: 24px; padding-right: 24px; } }
    @media (max-width: 640px) { .review-wrap { padding-left: 16px; padding-right: 16px; } }

    /* ── Card progress ── */
    .card-progress { margin-top: 12px; }
    .card-progress .cp-track {
      display: block; height: 4px; border-radius: 999px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      overflow: hidden; margin-bottom: 5px;
    }
    .card-progress .cp-fill {
      display: block; height: 100%; width: 0;
      background: var(--accent);
      border-radius: 999px; transition: width 0.5s ease;
    }
    .card-progress .cp-label {
      font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    .card-progress .cp-label.cp-done { color: var(--cat-color, var(--accent)); font-weight: 600; }

    /* ── Progress overview ── */
    .overview-wrap { padding: 6px 40px 0; }
    .overview {
      display: none;
      max-width: 1100px; margin: 0 auto;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px;
      align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    }
    .overview.show { display: flex; }
    .overview .ov-title {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted);
    }
    .overview .ov-stats { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
    .overview .ov-item { font-size: 12px; color: var(--text-secondary); }
    .overview .ov-item b { font-family: var(--font-mono); font-size: 15px; margin-right: 4px; }
    .overview .ov-item.ov-done b { color: var(--devops); }
    .overview .ov-item.ov-going b { color: var(--accent); }
    .overview .ov-item.ov-todo b { color: var(--text-muted); }
    .overview .ov-item.ov-streak b { color: var(--devops); }
    .overview .ov-milestones { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .overview .ov-actions { display: flex; gap: 8px; align-items: center; }
    .overview .ov-btn {
      font-family: var(--font-body); font-size: 11px; font-weight: 600;
      padding: 6px 12px; border-radius: 8px; cursor: pointer;
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text-secondary); transition: all 0.2s;
    }
    .overview .ov-btn:hover { border-color: var(--accent); color: var(--accent); }
    .overview .ov-import-note { font-size: 10px; color: var(--text-muted); }
    .overview .ov-btn.danger:hover { border-color: #ef476f; color: #ef476f; }

    /* ── Category dashboard ── */
    .ov-cats {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px;
    }
    .ov-cats.show { display: block; }
    .ov-cats-title {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }
    .ov-cat { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
    .ov-cat:last-child { margin-bottom: 0; }
    .ov-cat-name {
      width: 76px; flex: none; text-align: right;
      font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: var(--text-secondary);
    }
    .ov-cat-bar { flex: 1; height: 8px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .ov-cat-fill { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 0.5s ease; }
    .ov-cat-num { width: 96px; flex: none; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    @media (max-width: 1000px) { .ov-cats { margin-left: 24px; margin-right: 24px; } }
    @media (max-width: 640px) { .ov-cats { margin-left: 16px; margin-right: 16px; } }

    /* ── Daily goal ── */
    .ov-goal {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 20px; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .ov-goal.show { display: flex; }
    .og-label {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted);
    }
    .og-input {
      width: 150px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: var(--font-mono); font-size: 12px; padding: 6px 10px; outline: none;
    }
    .og-input:focus { border-color: rgba(211, 168, 83, 0.4); }
    .og-note { font-size: 10px; color: var(--text-muted); }
    .og-bar { flex: 1; min-width: 160px; height: 8px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .og-fill { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.5s ease; }
    .og-num { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }
    .og-num.og-done { color: var(--devops); font-weight: 700; }
    @media (max-width: 1000px) { .ov-goal { margin-left: 24px; margin-right: 24px; } }
    @media (max-width: 640px) { .ov-goal { margin-left: 16px; margin-right: 16px; } }

    /* ── Badges ── */
    .ov-badges {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px;
    }
    .ov-badges.show { display: block; }
    .ov-badges-title {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;

      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; padding: 7px 13px; border-radius: 999px;
      background: var(--bg-elevated); border: 1px solid var(--border);

      transition: border-color 0.2s, opacity 0.2s;

    @media (max-width: 640px) { .overview-wrap { padding-left: 16px; padding-right: 16px; } }

    /* ── Learning heatmap（近 90 天） ── */
    .ov-heat {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px;

    .hm-col { display: flex; flex-direction: column; gap: 3px; }
    .hm-cell { width: 11px; height: 11px; border-radius: 3px; background: var(--bg-elevated); border: 1px solid var(--border); }

    .hm-cell.l2 { background: #006d32; border-color: #006d32; }

    @media (max-width: 1000px) { .ov-heat { margin-left: 24px; margin-right: 24px; } }
    @media (max-width: 640px) { .ov-heat { margin-left: 16px; margin-right: 16px; } }

    /* ── Quiz trend ── */
    .ov-quiz {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px;
    }
    .ov-quiz.show { display: block; }
    .ov-quiz-title {
      display: flex; align-items: baseline; gap: 12px;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }
    .ov-quiz-title .qm-meta { font-size: 10px; letter-spacing: 0; color: var(--text-secondary); font-family: var(--font-mono); }
    .qz-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .qz-name { width: 170px; flex: none; text-align: right; font-size: 11px; font-weight: 600; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qz-bar { flex: 1; height: 8px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .qz-fill { display: block; height: 100%; width: 0; background: #00ff41; border-radius: 999px; transition: width 0.5s ease; }
    .qz-num { width: 64px; flex: none; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .qz-avg { margin-top: 4px; font-size: 11px; color: var(--devops); font-family: var(--font-mono); }
    @media (max-width: 1000px) { .ov-quiz { margin-left: 24px; margin-right: 24px; } }
    @media (max-width: 640px) { .ov-quiz { margin-left: 16px; margin-right: 16px; } }

    /* Hidden card animation */
    .card.filtered-out {
      opacity: 0 !important;
      transform: scale(0.96) !important;
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }

    /* ── Empty state ── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 72px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-text {
      font-size: 14px;
      color: var(--text-secondary);
    }


    /* ── Module view (shell) ── */
    .module-view { padding: 0; }
    .module-bar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 14px;

    /* ── Footer ── */
    .foot {

      padding: 20px 40px 56px;

      color: var(--text-muted);

    }

    (function () {

      function applyTheme() {
        var t = 'auto';
        try { t = localStorage.getItem('il_theme') || 'auto'; } catch (e) { /* storage unavailable */ }
        var dark = t === 'dark' ||
          (t === 'auto' && (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches));
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var btn = document.getElementById('btnTheme');
        if (btn) {
          btn.textContent = t === 'light' ? '☀' : (t === 'dark' ? '☾' : '◐');
          btn.title = '主题：' + (t === 'light' ? '亮色' : (t === 'dark' ? '暗色' : '自动跟随系统')) + '（点击切换）';
        }
      }
      applyTheme();
      var themeBtn = document.getElementById('btnTheme');
      if (themeBtn) {
        themeBtn.addEventListener('click', function () {
          var t = 'auto';
          try { t = localStorage.getItem('il_theme') || 'auto'; } catch (e) { /* noop */ }
          t = t === 'auto' ? 'light' : (t === 'light' ? 'dark' : 'auto');
          try { localStorage.setItem('il_theme', t); } catch (e) { /* noop */ }
          applyTheme();
        });
      }
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
          var t = 'auto';
          try { t = localStorage.getItem('il_theme') || 'auto'; } catch (e) { /* noop */ }
          if (t === 'auto') applyTheme();
        });
      }

      /* ═════════ 数据驱动：卡片 / 计数 / 页脚全部由 IL_COURSES 生成 ═════════ */
      var searchInput = document.getElementById('search');
      var filterBtns = document.querySelectorAll('#filters .pill');
      var grid = document.getElementById('grid');
      var activeCat = 'all';
      var courses = (window.IL_COURSES || []).slice();
      var cards = [];

      function esc(s) {
        var d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
      }

      var CAT_LABEL = { devops: 'DevOps', cs: 'CS 基础', automation: '自动化', tools: '开发工具' };
      var ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14M11 5l7 7-7 7"/></svg>';

      /* ═════════ 收藏（il_star：星标置顶） ═════════ */
      var STAR_ON = '&#9733;';   /* ★ */
      var STAR_OFF = '&#9734;';  /* ☆ */

      function readStars() {
        try {
          var arr = JSON.parse(localStorage.getItem('il_star') || '[]');
          return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
      }
      function writeStars(arr) {
        try { localStorage.setItem('il_star', JSON.stringify(arr)); } catch (e) { /* storage unavailable */ }
      }
      function isStarred(key) {
        return readStars().indexOf(key) !== -1;
      }
      function toggleStar(key) {
        var arr = readStars();
        var i = arr.indexOf(key);
        if (i === -1) {
          arr.push(key);
          toast('★ 已收藏：' + key);
        } else {
          arr.splice(i, 1);
          toast('☆ 已取消收藏：' + key);
        }
        writeStars(arr);
        updateStarIcons();
        sortCards();
      }
      function updateStarIcons() {
        cards.forEach(function (card) {
          var btn = card.querySelector('.card-star');
          if (!btn) return;
          btn.innerHTML = isStarred(btn.dataset.star) ? STAR_ON : STAR_OFF;
          btn.classList.toggle('on', isStarred(btn.dataset.star));
        });
      }
      function toast(msg) {
        var t = document.getElementById('toastBox');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
      }
      var toastTimer = null;

      function renderCards() {
        grid.innerHTML = '';
        cards = courses.map(function (c, i) {
          var a = document.createElement('a');
          a.className = 'card';
          a.href = c.key ? '#/m/' + c.key : '#';
          a.dataset.cat = c.cat;
          a.dataset.oidx = String(i);
          if (c.progress) a.dataset.progress = c.progress;
          if (c.total) a.dataset.total = String(c.total);
          var idx = (i + 1 < 10 ? '0' : '') + (i + 1);
          a.innerHTML =
            '<div class="card-head">' +
              '<span class="badge" data-b="' + esc(c.cat) + '">' + esc(CAT_LABEL[c.cat] || c.cat) + '</span>' +
              '<span class="card-head-right">' +
                '<button type="button" class="card-star' + (isStarred(c.key) ? ' on' : '') + '" data-star="' + esc(c.key) + '" title="收藏/取消收藏" aria-label="收藏">' +
                  (isStarred(c.key) ? STAR_ON : STAR_OFF) +
                '</button>' +
                '<span class="card-idx">' + idx + '</span>' +
              '</span>' +
            '</div>' +
            '<h3>' + esc(c.title) + '</h3>' +
            '<p class="card-desc">' + esc(c.desc) + '</p>' +
            '<div class="card-foot">' +
              '<span class="card-meta">~' + esc(c.size) + '</span>' +
              '<span class="card-go">开始学习 ' + ARROW_SVG + '</span>' +
            '</div>';
          a.style.animation = 'fadeUp 0.55s ease ' + (i * 0.05) + 's forwards';
          grid.appendChild(a);
          return a;
        });
        updateCounts();
      }

      function updateCounts() {
        var counts = { all: courses.length };
        courses.forEach(function (c) { counts[c.cat] = (counts[c.cat] || 0) + 1; });
        filterBtns.forEach(function (btn) {
          var el = btn.querySelector('.count');
          if (el) el.textContent = counts[btn.dataset.cat] || 0;
        });
        var foot = document.querySelector('.foot');
        if (foot) {
          foot.textContent = courses.length + ' INTERACTIVE COURSES · 4 DOMAINS · BUILT WITH INTERACTIVE-LEARNING SKILL';
        }
      }

      function filter() {
        var query = searchInput.value.toLowerCase().trim();
        var visible = 0;

        cards.forEach(function (card) {
          var cat = card.dataset.cat;
          var title = card.querySelector('h3').textContent.toLowerCase();
          var desc = card.querySelector('.card-desc').textContent.toLowerCase();
          var matchCat = activeCat === 'all' || cat === activeCat;
          /* 多关键词 AND：空格分隔，全部命中标题或描述才显示 */
          var terms = query ? query.split(/\s+/) : [];
          var matchSearch = !terms.length || terms.every(function (t) {
            return title.indexOf(t) !== -1 || desc.indexOf(t) !== -1;
          });
          var show = matchCat && matchSearch;

          if (show) {
            card.classList.remove('filtered-out');
            card.style.animation = 'none';
            card.offsetHeight; /* force reflow */
            card.style.animation = 'fadeUp 0.4s ease ' + (visible * 0.05) + 's forwards';
            visible++;
          } else {
            card.classList.add('filtered-out');
          }
        });

        /* Show empty state if no results */
        var existing = grid.querySelector('.empty');
        if (existing) existing.remove();

        if (visible === 0) {
          var empty = document.createElement('div');
          empty.className = 'empty';
          empty.innerHTML = '<div class="empty-icon">&#x2205;</div>' +
            '<div class="empty-text">没有找到匹配的课程</div>';
          grid.appendChild(empty);
        }
      }

      filterBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          filterBtns.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          activeCat = btn.dataset.cat;
          filter();
        });
      });

      searchInput.addEventListener('input', filter);

      /* ── 排序：默认 / 最近学习 / 学习进度（基于 il_progress，零侵入） ── */
      function progressPct(card, store) {
        var key = card.dataset.progress;
        if (!key) return -1;
        var p = store[key];
        if (!p || !p.steps || !p.steps.length) return 0;
        var total = parseInt(card.dataset.total || p.steps.length, 10);
        return Math.round(p.steps.length / total * 100);
      }
      function sortCards() {
        var mode = document.getElementById('sortSel').value;
        var store = readProgress();
        var stars = readStars();
        var kids = Array.prototype.slice.call(grid.querySelectorAll('.card'));
        kids.sort(function (a, b) {
          /* 星标置顶：任何模式下收藏都排在最前 */
          var sa = stars.indexOf(a.dataset.progress) !== -1 ? 1 : 0;
          var sb = stars.indexOf(b.dataset.progress) !== -1 ? 1 : 0;
          if (sa !== sb) return sb - sa;
          if (mode === 'recent') {
            var la = (store[a.dataset.progress] && store[a.dataset.progress].last) || 0;
            var lb = (store[b.dataset.progress] && store[b.dataset.progress].last) || 0;
            return lb - la;
          }
          if (mode === 'progress') {
            var da = progressPct(a, store), db = progressPct(b, store);
            if (da !== db) return db - da;
          }
          return parseInt(a.dataset.oidx, 10) - parseInt(b.dataset.oidx, 10);
        });
        kids.forEach(function (el) { grid.appendChild(el); });
      }
      /* 星标点击：不触发卡片跳转 */
      grid.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.card-star') : null;
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        toggleStar(btn.dataset.star);
      });
      document.getElementById('sortSel').addEventListener('change', sortCards);

      /* Keyboard shortcut: / to focus search */
      document.addEventListener('keydown', function (e) {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
        if (e.key === 'Escape' && document.activeElement === searchInput) {
          searchInput.value = '';
          searchInput.blur();
          filter();
        }
      });

      /* ── Progress tracking (localStorage: il_progress) ── */
      function readProgress() {
        try { return JSON.parse(localStorage.getItem('il_progress') || '{}'); }
        catch (e) { return {}; }
      }

      function initProgress() {
        var store = readProgress();
        var best = null;
        var doneCount = 0, goingCount = 0, totalMs = 0, totalDoneMs = 0;

        cards.forEach(function (card) {
          var key = card.dataset.progress;
          if (!key) return;
          var p = store[key];
          if (!p || !p.steps || !p.steps.length) return;

          var total = parseInt(card.dataset.total || p.steps.length, 10);
          var n = p.steps.length;
          var done = !!(p.done || n >= total);

          var wrap = document.createElement('div');
          wrap.className = 'card-progress';
          wrap.innerHTML = '<span class="cp-track"><span class="cp-fill" style="width:' +
            Math.min(100, Math.round(n / total * 100)) + '%"></span></span>' +
            '<span class="cp-label' + (done ? ' cp-done' : '') + '">' +
            (done ? '✓ 已完成' : '已解锁 ' + n + ' / ' + total + ' 步') + '</span>';
          card.appendChild(wrap);

          totalMs += total;
          if (done) { doneCount++; totalDoneMs += total; }
          else { goingCount++; totalDoneMs += n; }

          if (!done && (!best || (p.last || 0) > (best.last || 0))) {
            best = { key: key, last: p.last || 0 };
          }
        });

        if (best) {
          var target = document.querySelector('.card[data-progress="' + best.key + '"]');
          if (target) {
            var strip = document.getElementById('continueStrip');
            strip.href = target.getAttribute('href');
            var p = store[best.key];
            var total = parseInt(target.dataset.total || p.steps.length, 10);
            document.getElementById('csTitle').textContent = target.querySelector('h3').textContent;
            document.getElementById('csMeta').textContent = '· 已解锁 ' + p.steps.length + ' / ' + total + ' 步';
            strip.classList.add('show');
          }
        }

        /* Progress overview */
        if (doneCount + goingCount > 0) {
          var tracked = 0;
          cards.forEach(function (c) { if (c.dataset.progress) tracked++; });
          var todoCount = tracked - doneCount - goingCount;
          var streak = computeStreak(store);
          var ov = document.getElementById('progressOverview');
          document.getElementById('ovStats').innerHTML =
            '<span class="ov-item ov-streak"><b>' + streak + '</b>连续学习</span>' +
            '<span class="ov-item ov-going"><b>' + goingCount + '</b>进行中</span>' +
            '<span class="ov-item ov-done"><b>' + doneCount + '</b>已完成</span>' +
            '<span class="ov-item ov-todo"><b>' + todoCount + '</b>未开始</span>';
          document.getElementById('ovMilestones').textContent =
            '里程碑 ' + totalDoneMs + ' / ' + totalMs + ' 已解锁';
          ov.classList.add('show');
        }

        renderCatBars(store);
        renderGoal(store);
        renderBadges(store);
        renderHeatmap(store);
        renderQuizTrend(store);

        showDueReview(store);
      }

      /* ── 分类学习看板：每类已解锁步数 / 总步数 ── */
      var CAT_COLORS = { devops: '#00ff41', cs: '#00ff41', automation: '#00ff41', tools: '#00ff41' };
      function renderCatBars(store) {
        var el = document.getElementById('ovCats');
        if (!el) return;
        var acc = {};
        Object.keys(CAT_COLORS).forEach(function (k) { acc[k] = { done: 0, total: 0 }; });
        courses.forEach(function (c) {
          var a = acc[c.cat];
          if (!a) return;
          var total = c.total || 9;
          var p = store[c.progress];
          a.total += total;
          if (p && p.steps) a.done += Math.min(p.steps.length, total);
        });
        var any = Object.keys(acc).some(function (k) { return acc[k].done > 0; });
        if (!any) { el.classList.remove('show'); return; }
        var html = '';
        Object.keys(acc).forEach(function (k) {
          var a = acc[k];
          if (!a.total) return;
          var pct = Math.round(a.done / a.total * 100);
          html += '<div class="ov-cat"><span class="ov-cat-name">' + (CAT_LABEL[k] || k) + '</span>' +
            '<span class="ov-cat-bar"><span class="ov-cat-fill" style="width:' + pct + '%;background:' + CAT_COLORS[k] + '"></span></span>' +
            '<span class="ov-cat-num">' + a.done + ' / ' + a.total + ' 步 · ' + pct + '%</span></div>';
        });
        document.getElementById('ovCatsRows').innerHTML = html;
        el.classList.add('show');
      }

      /* ── 今日目标：每日里程碑目标（il_goal，按天生效） ── */
      function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      function renderGoal(store) {
        var el = document.getElementById('ovGoal');
        if (!el) return;
        var goal = null;
        try {
          var g = JSON.parse(localStorage.getItem('il_goal') || 'null');
          if (g && g.date === todayStr() && g.target > 0) goal = g;
        } catch (e) { /* storage unavailable */ }
        var todayMs = 0;
        var todayKey = new Date().toDateString();
        Object.keys(store).forEach(function (k) {
          var p = store[k];
          if (!p || !p.last) return;
          if (new Date(p.last).toDateString() === todayKey) todayMs += (p.steps || []).length;
        });
        var body = document.getElementById('ovGoalBody');
        if (!goal) {
          body.innerHTML = '<input type="number" id="goalInput" class="og-input" min="1" max="50" placeholder="今天想解锁几个里程碑？">' +
            '<button type="button" class="ov-btn" id="goalSave">设定</button><span class="og-note">按天生效，次日自动清零</span>';
          el.classList.add('show');
          var save = document.getElementById('goalSave');
          if (save) save.addEventListener('click', function () {
            var v = parseInt(document.getElementById('goalInput').value, 10);
            if (!v || v < 1) return;
            localStorage.setItem('il_goal', JSON.stringify({ date: todayStr(), target: Math.min(v, 50) }));
            renderGoal(store);
          });
          return;
        }
        var pct = Math.min(100, Math.round(todayMs / goal.target * 100));
        var done = todayMs >= goal.target;
        body.innerHTML = '<span class="og-bar"><span class="og-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="og-num' + (done ? ' og-done' : '') + '">' + todayMs + ' / ' + goal.target + ' 里程碑' + (done ? ' · 已达成 ✓' : '') + '</span>' +
          '<button type="button" class="ov-btn" id="goalEdit">修改</button>';
        el.classList.add('show');
        var edit = document.getElementById('goalEdit');
        if (edit) edit.addEventListener('click', function () {
          localStorage.removeItem('il_goal');
          renderGoal(store);
        });
      }

      /* ── 连续学习天数：聚合所有模块 last 时间戳的去重日期 ── */
      /* ── 成就徽章：按进度/连学/精通/满分自动解锁（il_badges） ── */
      var BADGES = [
        { id: 'streak3', icon: '&#x1F525;', name: '连学 3 天', req: '连续学习天数 ≥ 3' },
        { id: 'streak7', icon: '&#x1F3C5;', name: '连学 7 天', req: '连续学习天数 ≥ 7' },
        { id: 'master1', icon: '&#x1F3C6;', name: '首个精通', req: '完成任意 1 个模块（全部里程碑）' },
        { id: 'master3', icon: '&#x1F48E;', name: '三连精通', req: '完成 3 个模块' },
        { id: 'catPioneer', icon: '&#x1F3AF;', name: '分类先锋', req: '同一分类完成 ≥ 2 个模块' },
        { id: 'perfect', icon: '&#x2705;', name: '测验满分', req: '任意模块测验全对' },
        { id: 'quizAvg7', icon: '&#x1F4AF;', name: '测验学霸', req: '已完成测验的平均分 ≥ 7/8' },
        { id: 'halfway', icon: '&#x1F4DA;', name: '半程达成', req: '完成模块数 ≥ 全部模块一半' },
        { id: 'finisher', icon: '&#x1F3C1;', name: '全站通关', req: '完成全部模块（所有里程碑）' }
      ];

      function evaluateBadges(store) {
        var doneCount = 0, tracked = 0;
        var catDone = {};
        courses.forEach(function (c) {
          var key = c.progress;
          if (!key) return;
          tracked++;
          var p = store[key];
          var total = parseInt(c.total || 9, 10);
          if (p && (p.done || (p.steps && p.steps.length >= total))) {
            doneCount++;
            catDone[c.cat] = (catDone[c.cat] || 0) + 1;
          }
        });
        var streak = computeStreak(store);
        var perfect = Object.keys(store).some(function (k) {
          var q = store[k] && store[k].quiz;
          return q && q.total && q.score === q.total;
        });
        var quizScores = [];
        Object.keys(store).forEach(function (k) {
          var q = store[k] && store[k].quiz;
          if (q && q.total && typeof q.score === 'number') quizScores.push(q.score);
        });
        var quizAvg = quizScores.length ? quizScores.reduce(function (a, b) { return a + b; }, 0) / quizScores.length : 0;
        var catPioneer = Object.keys(catDone).some(function (k) { return catDone[k] >= 2; });
        return {
          streak3: streak >= 3,
          streak7: streak >= 7,
          master1: doneCount >= 1,
          master3: doneCount >= 3,
          catPioneer: catPioneer,
          perfect: perfect,
          quizAvg7: quizScores.length > 0 && quizAvg >= 7,
          halfway: tracked > 0 && doneCount >= Math.ceil(tracked / 2),
          finisher: tracked > 0 && doneCount >= tracked
        };
      }

      function renderBadges(store) {
        var el = document.getElementById('ovBadges');
        if (!el) return;
        var res = evaluateBadges(store);
        var unlocked = [];
        try { unlocked = JSON.parse(localStorage.getItem('il_badges') || '[]'); }
        catch (e) { unlocked = []; }
        var newly = BADGES.filter(function (b) { return res[b.id] && unlocked.indexOf(b.id) === -1; });
        if (newly.length) {
          unlocked = BADGES.filter(function (b) { return res[b.id]; }).map(function (b) { return b.id; });
          try { localStorage.setItem('il_badges', JSON.stringify(unlocked)); } catch (e) { /* storage unavailable */ }
          toast('🏅 解锁成就：' + newly.map(function (b) { return b.name; }).join('、'));
        }
        var row = document.getElementById('ovBadgesRow');
        row.innerHTML = BADGES.map(function (b) {
          var on = !!res[b.id];
          return '<span class="badge-chip ' + (on ? 'unlocked' : 'locked') + '" title="' + esc(b.req) + '">' +
            '<span class="b-ico">' + b.icon + '</span>' + esc(b.name) + (on ? ' &#10003;' : '') + '</span>';
        }).join('');
        document.getElementById('ovBadgesCount').textContent = '· ' + unlocked.length + ' / ' + BADGES.length + ' 已解锁';
        el.classList.add('show');
      }

      /* ── 学习热力图：近 90 天 GitHub 风格日历（聚合各模块 last） ── */
      function renderHeatmap(store) {
        var el = document.getElementById('ovHeat');
        if (!el) return;
        var counts = {};
        Object.keys(store).forEach(function (k) {
          var p = store[k];
          if (p && p.last) {
            var ds = new Date(p.last).toDateString();
            counts[ds] = (counts[ds] || 0) + 1;
          }
        });
        var today = new Date(); today.setHours(0, 0, 0, 0);
        var start = new Date(today); start.setDate(start.getDate() - 89);
        var dow = (start.getDay() + 6) % 7; /* 周一起始 */
        start.setDate(start.getDate() - dow);
        var cells = [];
        var d = new Date(start);
        while (d <= today) {
          cells.push({ key: d.toDateString(), n: counts[d.toDateString()] || 0, date: new Date(d) });
          d.setDate(d.getDate() + 1);
        }
        var grid = '';
        for (var c = 0; c < cells.length; c += 7) {
          var col = cells.slice(c, c + 7);
          grid += '<div class="hm-col">' + col.map(function (cell) {
            var lvl = cell.n === 0 ? 0 : Math.min(4, cell.n);
            var y = cell.date.getFullYear(), m = cell.date.getMonth() + 1, dd = cell.date.getDate();
            return '<span class="hm-cell l' + lvl + '" title="' + y + '-' + m + '-' + dd + '：' + cell.n + ' 次学习"></span>';
          }).join('') + '</div>';
        }
        document.getElementById('ovHeatGrid').innerHTML = grid;
        var activeDays = cells.filter(function (cell) { return cell.n > 0; }).length;
        if (activeDays === 0) return; /* 无学习记录时不展示热力图 */
        document.getElementById('ovHeatMeta').textContent = '近 90 天活跃 ' + activeDays + ' 天';
        el.classList.add('show');
      }

      /* ── 测验成绩趋势：聚合各模块 quiz 成绩 ── */
      function renderQuizTrend(store) {
        var el = document.getElementById('ovQuiz');
        if (!el) return;
        var rows = [];
        cards.forEach(function (card) {
          var key = card.dataset.progress;
          if (!key) return;
          var p = store[key];
          if (p && p.quiz && p.quiz.total) {
            var title = card.querySelector('.card-title');
            rows.push({ name: title ? title.textContent : key, score: p.quiz.score, total: p.quiz.total });
          }
        });
        if (!rows.length) return;
        rows.sort(function (a, b) { return (b.score / b.total) - (a.score / a.total); });
        var totalPct = 0;
        var html = rows.map(function (r) {
          var pct = Math.round(r.score / r.total * 100);
          totalPct += pct;
          return '<div class="qz-row"><span class="qz-name">' + esc(r.name) + '</span>' +
            '<span class="qz-bar"><span class="qz-fill" style="width:' + pct + '%"></span></span>' +
            '<span class="qz-num">' + r.score + '/' + r.total + '</span></div>';
        }).join('');
        document.getElementById('ovQuizRows').innerHTML = html;
        var avg = Math.round(totalPct / rows.length);
        document.getElementById('ovQuizMeta').textContent = rows.length + ' 个模块完成测验 · 平均 ' + avg + ' 分';
        el.classList.add('show');
      }

      /* ── 连续学习天数：聚合所有模块 last 时间戳的去重日期 ── */
      function computeStreak(store) {
        var days = {};
        Object.keys(store).forEach(function (k) {
          var last = store[k] && store[k].last;
          if (last) days[new Date(last).toDateString()] = true;
        });
        if (!Object.keys(days).length) return 0;
        var cur = new Date();
        if (!days[cur.toDateString()]) cur.setDate(cur.getDate() - 1); /* 今天未学则从昨天起算 */
        var streak = 0;
        while (days[cur.toDateString()]) { streak++; cur.setDate(cur.getDate() - 1); }
        return streak;
      }
      var REVIEW_DAY = 86400000;
      function showDueReview(store) {
        var now = Date.now();
        var due = [];
        cards.forEach(function (card) {
          var key = card.dataset.progress;
          if (!key) return;
          var p = store[key];
          if (!p || !p.last) return;
          var total = parseInt(card.dataset.total || (p.steps ? p.steps.length : 1), 10);
          var n = p.steps ? p.steps.length : 0;
          var done = !!(p.done || n >= total);
          var days = Math.floor((now - p.last) / REVIEW_DAY);
          if (done ? days >= 7 : days >= 3) {
            due.push({ card: card, days: days, done: done });
          }
        });
        if (!due.length) return;
        due.sort(function (a, b) { return a.days - b.days; }); /* 最久未复习的优先 */
        var top = due[0];
        var strip = document.getElementById('reviewStrip');
        strip.href = top.card.getAttribute('href');
        var label = top.done ? '已掌握 · 可巩固' : '待复习';
        document.getElementById('rsMeta').textContent =
          label + ' · ' + top.card.querySelector('h3').textContent + ' · ' + top.days + ' 天未复习' +
          (due.length > 1 ? '（共 ' + due.length + ' 个模块）' : '');
        strip.classList.add('show');
      }

      /* ── 进度备份：导出 / 导入 il_progress ── */
      function exportProgress() {
        var data = localStorage.getItem('il_progress') || '{}';
        var blob = new Blob([data], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'il-progress-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
      }

      function importProgressFile(file) {
        var r = new FileReader();
        r.onload = function () {
          try {
            var obj = JSON.parse(String(r.result));
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('not-object');
            localStorage.setItem('il_progress', JSON.stringify(obj));
            location.reload();
          } catch (e) {
            alert('导入失败：文件不是有效的进度备份 JSON');
          }
        };
        r.readAsText(file);
      }

      /* ── 学习报告：il_progress + 课程元数据 → Markdown 下载 ── */
      function fmtDate(ts) {
        if (!ts) return '—';
        var d = new Date(ts);
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      }
      function exportReport() {
        var store = {};
        try { store = JSON.parse(localStorage.getItem('il_progress') || '{}'); }
        catch (e) { store = {}; }
        var catNames = { devops: 'DevOps', cs: '计算机科学', automation: '自动化', tools: '效率工具' };
        var lines = [];
        lines.push('# 交互式学习 · 学习报告');
        lines.push('');
        lines.push('生成时间：' + new Date().toLocaleString('zh-CN') + '（浏览器本地）');
        lines.push('');
        var doneCount = 0, tracked = 0, quizDone = 0, quizSum = 0;
        var rows = courses.map(function (c) {
          var key = c.progress;
          if (!key) return null;
          tracked++;
          var p = store[key] || {};
          var total = parseInt(c.total || 9, 10);
          var steps = p.steps ? p.steps.length : 0;
          var done = !!(p.done || steps >= total);
          if (done) doneCount++;
          var quizTxt = '—';
          if (p.quiz && p.quiz.total) {
            quizTxt = p.quiz.score + '/' + p.quiz.total;
            quizDone++; quizSum += p.quiz.score;
          }
          var status = done ? '已掌握' : (steps > 0 ? '进行中' : '未开始');
          return {
            title: c.title || key,
            cat: catNames[c.cat] || c.cat,
            status: status,
            steps: steps + '/' + total,
            quiz: quizTxt,
            last: fmtDate(p.last)
          };
        }).filter(Boolean);
        var pct = tracked ? Math.round(doneCount / tracked * 100) : 0;
        var quizAvgTxt = quizDone ? (Math.round(quizSum / quizDone * 100) / 100).toFixed(2) : '—';
        lines.push('## 概览');
        lines.push('');
        lines.push('- 模块总数：' + tracked);
        lines.push('- 已完成：' + doneCount + '（' + pct + '%）');
        lines.push('- 测验完成：' + quizDone + ' 个模块，平均 ' + quizAvgTxt + '/8');
        lines.push('- 学习报告由本地进度生成，未提交任何个人数据');
        lines.push('');
        lines.push('## 模块明细');
        lines.push('');
        lines.push('| 模块 | 分类 | 状态 | 里程碑 | 测验 | 最近学习 |');
        lines.push('|---|---|---|---|---|---|');
        rows.forEach(function (r) {
          lines.push('| ' + r.title + ' | ' + r.cat + ' | ' + r.status + ' | ' + r.steps + ' | ' + r.quiz + ' | ' + r.last + ' |');
        });
        lines.push('');
        var blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'learning-report-' + new Date().toISOString().slice(0, 10) + '.md';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
      }


      /* ═════════ 单页壳：按需加载模块数据（modules/<key>.js）并渲染 ═════════ */
      var navView = document.getElementById('navView');
      var moduleView = document.getElementById('moduleView');
      var moduleRoot = document.getElementById('moduleRoot');
      var moduleTitle = document.getElementById('moduleTitle');
      var loadedModules = {};
      var activeAssets = [];

      function cleanupModule() {
        activeAssets.forEach(function (el) { if (el && el.parentNode) el.parentNode.removeChild(el); });
        activeAssets = [];
        moduleRoot.innerHTML = '';
      }

      function injectModuleAssets(mod) {
        (mod.links || []).forEach(function (ln) {
          var href = (ln.match(/href="([^"]+)"/) || [])[1];
          if (!href) return;
          var el = document.createElement('link');
          el.rel = 'stylesheet';
          el.href = href;
          document.head.appendChild(el);
          activeAssets.push(el);
        });
        var st = document.createElement('style');
        st.textContent = mod.css || '';
        document.head.appendChild(st);
        activeAssets.push(st);
      }

      function renderModule(key) {
        var mod = window.IL_MODULES && window.IL_MODULES[key];
        if (!mod) return;
        cleanupModule();
        injectModuleAssets(mod);
        moduleRoot.innerHTML = mod.html || '';
        moduleTitle.textContent = mod.title || '';
        var js = document.createElement('script');
        js.textContent = mod.js || '';
        moduleRoot.appendChild(js);
        if (mod.needsReady) {
          document.dispatchEvent(new Event('DOMContentLoaded'));
        }
        window.scrollTo(0, 0);
      }

      function loadModule(key) {
        if (loadedModules[key]) { renderModule(key); return; }
        var s = document.createElement('script');
        s.src = 'modules/' + key + '.js';
        s.onload = function () { loadedModules[key] = true; renderModule(key); };
        s.onerror = function () { moduleTitle.textContent = '模块加载失败: ' + key; };
        document.head.appendChild(s);
      }

      function showNav() {
        cleanupModule();
        moduleView.hidden = true;
        navView.hidden = false;
      }

      function route() {
        var m = location.hash.match(/^#\/m\/([\w-]+)/);
        if (m && courses.some(function (c) { return c.key === m[1]; })) {
          navView.hidden = true;
          moduleView.hidden = false;
          loadModule(m[1]);
        } else {
          showNav();
        }
      }

      window.addEventListener('hashchange', route);

      /* 备份恢复按钮 */
      document.getElementById('btnExport').addEventListener('click', exportProgress);
      document.getElementById('btnReport').addEventListener('click', exportReport);
      var importFile = document.getElementById('importFile');
      document.getElementById('btnImport').addEventListener('click', function () { importFile.click(); });
      importFile.addEventListener('change', function () {
        if (importFile.files && importFile.files[0]) importProgressFile(importFile.files[0]);
        importFile.value = '';
      });

      /* 重置全部进度（confirm 保护，清空后重载） */
      document.getElementById('btnReset').addEventListener('click', function () {
        if (!window.confirm('确定要清空全部模块的学习进度吗？此操作不可撤销，可先导出备份。')) return;
        try {
          localStorage.removeItem('il_progress');
          location.reload();
        } catch (e) { /* storage unavailable */ }
      });

      renderCards();
      sortCards();
      initProgress();
      route();
    })();
  </script>
  <div class="toast-box" id="toastBox"></div>
</body>
</html>
