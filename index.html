  /* ── 触控热区地板（本轮由 46 模块普查定线）────────────────────────────
     390×844 触屏下实测：12 个模块有 47 个真控件 <24px、11 个模块有 125 个
     落在 24–31px。逐模块补 padding 要改十几套 CSS，而其中绝大多数只是
     "盒子比手指窄"，不是布局问题，所以地板放在 skin 层。

     为什么阈值取 24 而不是 32/44：
       - 32/44 是 Apple HIG / Material 的建议值，不是规范硬线；对"正文行内的
         外链""代码块里的 💡 提示""紧凑 stepper"这类元素强行拉到 44px 会撑坏
         既有排版，换来的只是"看起来更绿"的报表。
       - WCAG 2.5.8（AA）的判据是 **24×24 CSS 像素**，并给了 Inline 例外：
         行内链接由周围文字控制间距时免于该尺寸。所以这里按规范线做硬地板，
         行内链接（display:inline 的 a / span / code）一概不动。
     仍低于 32px 的那批（修完地板后实测 146 个）交给 tools/check-tap.js 以 WARN
     形式列出，由模块作者决定。 */
  #moduleRoot button:not([role="link"]),
  #moduleRoot select,
  #moduleRoot textarea,
  #moduleRoot input:not([type="range"]):not([type="color"]):not([type="hidden"]),
  #moduleRoot [role="button"]:not([role="link"]),
  #moduleRoot a[href]:not([role="link"]) { min-height: 24px; }
  /* min-height 对 display:inline 的盒无效，所以正文里的行内 <a> 天然不受这条
     影响（也正因如此不需要再写 "除行内链接外" 的排除条件）。 */
  /* 原生 checkbox/radio 只设 min-height 会画成"18px 的方框占 24px 的盒"
     （实测 13x18 / 13x13），视觉错位；直接给等尺寸盒，浏览器会缩放对勾。
     这里必须带 !important：CSS 隔离把模块规则也前缀成 `#moduleRoot .complete-check
     input[type="checkbox"]`（特异度 1,2,1），比这条 1,1,1 更高——cf-workers 的
     `width:18px` 就是靠这个把 24px 顶掉的（实测宽仍是 13）。 */
  #moduleRoot input[type="checkbox"],
  #moduleRoot input[type="radio"] { width: 24px !important; height: 24px !important; flex: none; }
  /* 包裹型 label（`<label><input>文字</label>`）是真正的热区，模块普遍只给它
     0.8–0.9em 字号（docker 实测 23px、cf-workers 27px），拉到 32px 才不丢点。
     带 for= 的标题 label（"姓名 <input id=x>"在结构上不是父级）不受影响。 */
  #moduleRoot label:has(input),
  #moduleRoot label:has(select),
  #moduleRoot label:has(textarea) { min-height: 32px; }
  /* 用 div 冒充复选框的模块（makefile .check-box 22x22）：模块侧补不了就点名，
     与 [data-mod="git"] h2 .num 同一套"精确点名"逃生阀。 */
  #moduleRoot[data-mod="makefile"] .check-box { width: 28px; height: 28px; }
  /* 独立成行的链接必须换盒模型，不能只靠上面那条 min-height：
     CSS 2.1 规定 min-height **不适用**于非替换 inline 盒，所以 `a { min-height:24px }`
     是引擎行为——沙箱的 Chrome for Testing 152 应用了（实测 24px），CI 的 Chromium
     没应用（实测 17px），于是同一个元素本地 WARN、CI FAIL。规范内的写法是换盒模型：
     inline-block 才真的吃得到 min-height，同时保持 shrink-to-fit（实测长文本仍会在
     容器内换行、不产生横向溢出）。
     选择器只能用 :only-child，而它**只看元素子节点、不看文本节点**，所以"回到
     [链接]"这种行文里的链接也会被命中：全库实测命中 34 个，其中 33 个是导航页/
     参考文档这类短链接（最宽 137px，祖先无一需要横滚），换成 inline-block 的唯一
     可见差别是它自己的行盒被抬到 24px。这是这条地板的代价，不是漏网——真正需要
     免掉的"正文行内链接"由 check-tap 的 Inline 豁免处理，两条口径不同。 */
  #moduleRoot p > a[href]:only-child,
  #moduleRoot div > a[href]:only-child,
  #moduleRoot li > a[href]:only-child { display: inline-block; }

  </style>

  <script src="courses.js"></script>
  <script src="ilquiz.js"></script>
  <script src="ilcontrast.js"></script>
  <script src="ilquizzes.js"></script>
  <script>
    (function () {
      /* ═════════ 主题切换：il_theme（light / dark / auto） ═════════ */
      /* 对比度底线：导航页与当前模块各跑一次。ILContrast 缺席（缓存的旧页面）
         时静默跳过，主题与阅读不受影响。
         必须走 refresh() 而不是裸 run()：本函数是在 data-theme 刚刚改掉的同一个
         task 里跑的，带 transition 的属性（.pill / .card 全是 .2s~.25s）此刻还停在
         过渡起点，而底色祖先没有 transition、已经翻成新主题了——读出来是
         "旧字 + 新底"的混合态。实测 light 启动那一趟把 .pill.active 的
         rgb(0,255,65) 当成源色算出 1.19:1，钉成 rgb(0,122,31)（4.41:1），
         比作者本来合格的 5.28:1 更差，而且再没人重算。refresh() 先撤销上一次
         推出来的颜色、再等过渡走完补一遍，兜底才不会把兜底的东西改坏。 */
      function refreshContrast() {
        if (!window.ILContrast) return;
        var nav = document.getElementById('navView');
        if (nav) ILContrast.refresh(nav);
        if (window.IL_MODULES && moduleRoot.innerHTML) ILContrast.refresh(moduleRoot);
      }
      document.addEventListener('il:theme', applyTheme);

      function applyTheme() {
        var t = 'auto';
        try { t = localStorage.getItem('il_theme') || 'auto'; } catch (e) { /* storage unavailable */ }
        var dark = t === 'dark' ||
          (t === 'auto' && (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches));
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        /* 主题换了，底色换了，之前推出来的前景色全部作废——重算。
           放在这里而不是监听 il:theme：壳层按钮与模块按钮最终都会走到本函数
           （模块按钮经 IL.setTheme → il:theme → 下面那个 listener），一处即可。 */
        refreshContrast();
        var btn = document.getElementById('btnTheme');
        if (btn) {
          btn.textContent = t === 'light' ? '☀' : (t === 'dark' ? '☾' : '◐');
          btn.title = '主题：' + (t === 'light' ? '亮色' : (t === 'dark' ? '暗色' : '自动跟随系统')) + '（点击切换）';
        }
      }
      applyTheme();
      var themeBtn = document.getElementById('btnTheme');
      if (themeBtn) {
        themeBtn.addEventListener('click', function () {
          var t = 'auto';
          try { t = localStorage.getItem('il_theme') || 'auto'; } catch (e) { /* noop */ }
          t = t === 'auto' ? 'light' : (t === 'light' ? 'dark' : 'auto');
          try { localStorage.setItem('il_theme', t); } catch (e) { /* noop */ }
          applyTheme();
        });
      }
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
          var t = 'auto';
          try { t = localStorage.getItem('il_theme') || 'auto'; } catch (e) { /* noop */ }
          if (t === 'auto') applyTheme();
        });
      }

      /* ═════════ 数据驱动：卡片 / 计数 / 页脚全部由 IL_COURSES 生成 ═════════ */
      var searchInput = document.getElementById('search');
      var filterBtns = document.querySelectorAll('#filters .pill');
      var grid = document.getElementById('grid');
      var activeCat = 'all';
      var courses = (window.IL_COURSES || []).slice();
      var cards = [];

      function esc(s) {
        var d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
      }

      var CAT_LABEL = { devops: 'DevOps', cs: 'CS 基础', automation: '自动化', tools: '开发工具' };
      var ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14M11 5l7 7-7 7"/></svg>';

      /* ═════════ 收藏（il_star：星标置顶） ═════════ */
      var STAR_ON = '&#9733;';   /* ★ */
      var STAR_OFF = '&#9734;';  /* ☆ */

      function readStars() {
        try {
          var arr = JSON.parse(localStorage.getItem('il_star') || '[]');
          return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
      }
      function writeStars(arr) {
        try { localStorage.setItem('il_star', JSON.stringify(arr)); } catch (e) { /* storage unavailable */ }
      }
      function isStarred(key) {
        return readStars().indexOf(key) !== -1;
      }
      function toggleStar(key) {
        var arr = readStars();
        var i = arr.indexOf(key);
        if (i === -1) {
          arr.push(key);
          toast('★ 已收藏：' + key);
        } else {
          arr.splice(i, 1);
          toast('☆ 已取消收藏：' + key);
        }
        writeStars(arr);
        updateStarIcons();
        sortCards();
      }
      function updateStarIcons() {
        cards.forEach(function (card) {
          var btn = card.querySelector('.card-star');
          if (!btn) return;
          btn.innerHTML = isStarred(btn.dataset.star) ? STAR_ON : STAR_OFF;
          btn.classList.toggle('on', isStarred(btn.dataset.star));
        });
      }
      function toast(msg) {
        var t = document.getElementById('toastBox');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
      }
      var toastTimer = null;

      function renderCards() {
        grid.innerHTML = '';
        cards = courses.map(function (c, i) {
          var a = document.createElement('a');
          a.className = 'card';
          a.href = c.key ? '#/m/' + c.key : '#';
          a.dataset.cat = c.cat;
          a.dataset.oidx = String(i);
          a.dataset.key = c.key || '';
          if (c.progress) a.dataset.progress = c.progress;
          if (c.total) a.dataset.total = String(c.total);
          if (c.tags) a.dataset.tags = c.tags.join(' ');
          var idx = (i + 1 < 10 ? '0' : '') + (i + 1);
          a.innerHTML =
            '<div class="card-head">' +
              '<span class="badge" data-b="' + esc(c.cat) + '">' + esc(CAT_LABEL[c.cat] || c.cat) + '</span>' +
              '<span class="card-head-right">' +
                '<button type="button" class="card-star' + (isStarred(c.key) ? ' on' : '') + '" data-star="' + esc(c.key) + '" title="收藏/取消收藏" aria-label="收藏">' +
                  (isStarred(c.key) ? STAR_ON : STAR_OFF) +
                '</button>' +
                '<span class="card-idx">' + idx + '</span>' +
              '</span>' +
            '</div>' +
            '<h3>' + esc(c.title) + '</h3>' +
            '<p class="card-desc">' + esc(c.desc) + '</p>' +
            '<div class="card-foot">' +
              '<span class="card-meta">~' + esc(c.size) + '</span>' +
              '<span class="card-go">开始学习 ' + ARROW_SVG + '</span>' +
            '</div>';
          a.style.animation = 'fadeUp 0.55s ease ' + (i * 0.05) + 's forwards';
          grid.appendChild(a);
          return a;
        });
        updateCounts();
      }

      function updateCounts() {
        var counts = { all: courses.length };
        courses.forEach(function (c) { counts[c.cat] = (counts[c.cat] || 0) + 1; });
        filterBtns.forEach(function (btn) {
          var el = btn.querySelector('.count');
          if (el) el.textContent = counts[btn.dataset.cat] || 0;
        });
        var foot = document.querySelector('.foot');
        if (foot) {
          foot.textContent = courses.length + ' INTERACTIVE COURSES · 4 DOMAINS · BUILT WITH INTERACTIVE-LEARNING SKILL';
        }
      }

      /* ── 搜索 ──
       * 过去只比对 title + desc 的 DOM 文本，于是 15/45 个模块连自己的 key 都搜不到
       * （k8s / regex / ts / sqlidx / css-layout …），而卡片分类 Pill 明明写着
       * DevOps，搜 "DevOps" 却零结果——因为分类名也只渲染在 Pill 上。
       * 现在把 key、分类中文名、tags 一起纳入匹配；tags 来自 courses.js，
       * 每个标签都被 tools/check-courses.js 验证过确实出现在该模块源码里，
       * 所以"搜得到"不等于"教了这个"是假的。 */
      function searchBlob(card) {
        if (!card._sb) {
          card._sb = [
            card.querySelector('h3').textContent,
            card.querySelector('.card-desc').textContent,
            card.dataset.key,
            CAT_LABEL[card.dataset.cat] || '',
            card.dataset.tags || ''
          ].join(' ').toLowerCase();
        }
        return card._sb;
      }

      /* 零结果时给一个"是不是想找 X"，只做建议、不静默改写结果——自动模糊
       * 匹配会把不相关的卡片塞进来，更难排查。
       * 相似度取两路的较大值：
       *   Dice 二元组——对"工作流引擎 → 工作流"这类包含关系有效；
       *   编辑距离（OSA）——纯 Dice 会漏掉换位拼写："gprc" vs "grpc" 的
       *   二元组集合交集为空，直接判 0 分，而它显然就是 gRPC。
       * 编辑距离只在两边都 ≥3 字符时参与，否则两个两字中文词换一个字母
       * 就有 0.5 的分数，"网关"会莫名推出"网络"这种假建议。 */
      function bigrams(s) {
        var m = {};
        for (var i = 0; i < s.length - 1; i++) m[s.slice(i, i + 2)] = 1;
        return m;
      }
      function dice(a, b) {
        if (!a || !b) return 0;
        if (a === b) return 1;
        var ba = bigrams(a), bb = bigrams(b), inter = 0, size = 0, k;
        for (k in ba) size++;
        for (k in bb) { if (ba[k]) inter++; size++; }
        return size ? (2 * inter) / size : 0;
      }
      /* optimal string alignment：比 Levenshtein 多允许"换位算一次" */
      function editDist(a, b) {
        var la = a.length, lb = b.length, i, j, d, prev;
        var pv = [], cu = [];
        for (j = 0; j <= lb; j++) pv[j] = j;
        for (i = 1; i <= la; i++) {
          cu[0] = i;
          for (j = 1; j <= lb; j++) {
            d = Math.min(
              pv[j] + 1,
              cu[j - 1] + 1,
              pv[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
            );
            if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
              d = Math.min(d, pv[j - 2] + 1);
            }
            cu[j] = d;
          }
          prev = pv; pv = cu; cu = prev;
        }
        return pv[lb];
      }
      function similarity(a, b) {
        var s = dice(a, b);
        if (a.length >= 3 && b.length >= 3) {
          var e = 1 - editDist(a, b) / Math.max(a.length, b.length);
          if (e > s) s = e;
        }
        return s;
      }
      function bestMatch(query, cards) {
        var best = null;
        cards.forEach(function (card) {
          var words = searchBlob(card).split(/[\s、，,（）()\/·]+/);
          words.forEach(function (w) {
            if (!w || w.length < 2) return;
            var s = similarity(query, w);
            var d = Math.abs(w.length - query.length);
            var bd = best ? Math.abs(best.word.length - query.length) : 99;
            /* 分数相等时优先更接近查询长度的候选词："gprc" 与 "grpc"/"plc"
             * 都是 0.5（OSA 距离 1），Δlen 为 0 的 "grpc" 才是更合理的建议。 */
            if (!best || s > best.score || (s === best.score && d < bd)) {
              best = { score: s, card: card, word: w };
            }
          });
        });
        return best && best.score >= 0.5 ? best : null;
      }

      function filter() {
        var query = searchInput.value.toLowerCase().trim();
        var visible = 0;

        cards.forEach(function (card) {
          var cat = card.dataset.cat;
          var matchCat = activeCat === 'all' || cat === activeCat;
          /* 多关键词 AND：空格分隔，每个词都要命中可搜文本 */
          var terms = query ? query.split(/\s+/) : [];
          var blob = searchBlob(card);
          var matchSearch = !terms.length || terms.every(function (t) {
            return blob.indexOf(t) !== -1;
          });
          var show = matchCat && matchSearch;

          if (show) {
            card.classList.remove('filtered-out');
            card.style.animation = 'none';
            card.offsetHeight; /* force reflow */
            card.style.animation = 'fadeUp 0.4s ease ' + (visible * 0.05) + 's forwards';
            visible++;
          } else {
            card.classList.add('filtered-out');
          }
        });

        /* Show empty state if no results */
        var existing = grid.querySelector('.empty');
        if (existing) existing.remove();

        if (visible === 0) {
          var empty = document.createElement('div');
          empty.className = 'empty';
          var hint = '';
          var m = query ? bestMatch(query, cards) : null;
          if (m) {
            /* 建议目标写进 dataset，点击时从按钮自身读：filter() 会被反复调用，
               闭包捕获共享 var 容易在重渲染后指到旧卡片。 */
            hint = '<button type="button" class="empty-suggest" id="emptySuggest" data-key="' +
              esc(m.card.dataset.key) + '">是不是想找「' +
              esc(m.card.querySelector('h3').textContent) + '」</button>';
          } else if (query) {
            hint = '<div class="empty-note">换个关键词试试，或点分类 Pill 浏览</div>';
          }
          empty.innerHTML = '<div class="empty-icon">&#x2205;</div>' +
            '<div class="empty-text">没有找到匹配的课程</div>' + hint;
          grid.appendChild(empty);
          var sug = document.getElementById('emptySuggest');
          if (sug) sug.addEventListener('click', function () {
            searchInput.value = sug.dataset.key;
            filter();
            searchInput.focus();
          });
        }
      }

      filterBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          filterBtns.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          activeCat = btn.dataset.cat;
          filter();
        });
      });

      searchInput.addEventListener('input', filter);

      /* ── 排序：默认 / 最近学习 / 学习进度（基于 il_progress，零侵入） ── */
      /* 进度 key：模块写 il_progress 用的键。声明了 progress 字段的取字段，
         否则回退到卡片 key（统一进度协议后两者一致）。 */
      function progKey(card) {
        return card.dataset.progress || card.dataset.key || '';
      }

      /* ── 掌握度派生：把两类模块归一到同一条进度语义 ──
       * 全站模块分两种（计数以 courses.js 为准，别在这里写死）：
       *   milestone  有 9 里程碑体系（courses.js 声明了 total，模块调 IL.mount 写 steps）
       *   assess     没有里程碑体系，只有一个判分测验（13 个：8 个自带题库
       *              cs/docker/gh-actions/makefile/net/n8n/vfd/vscode，
       *              5 个由壳层 ilquizzes.js 挂载 cf-workers/pid/plc/web/yaml）
       * 壳层过去只认 steps，于是 assess 型永远不算完成：🏁全站通关数学上不可能，
       * 自动化看板满分学生也读 0%，卡片永远停在"未开始"。
       * 这里让 assess 型按测验掌握度参与统计——及格线取 75%，与 ilquiz.js 里
       * IL.quiz 的默认 pass 阈值一致，"达标"在运行时和用户眼里是同一件事。
       * 关键约束：壳层只读不写。steps 的含义（模块内解锁的里程碑）不被改写，
       * IL.touch 也继续不写 steps/done——访问不等于掌握。 */
      var PASS_RATIO = 0.75;
      function passLine(total) { return Math.ceil(total * PASS_RATIO); }
      function deriveEntry(key, declared, p) {
        var hasSteps = !!(p.steps && p.steps.length);
        var hasQuiz = !!(p.quiz && p.quiz.total);
        var d = {
          key: key, kind: declared > 0 ? 'milestone' : 'assess',
          n: 0, total: 0, frac: 0, mastered: false,
          /* started = 真做过题（解锁过里程碑或交过卷）。visited 只表示打开过：
             IL.touch 每次进模块都会写 last，访问不等于掌握，故 visited 不计入
             "进行中"，否则随手点开一个模块就永远显示在读。 */
          started: hasSteps || hasQuiz,
          visited: hasSteps || hasQuiz || !!p.last
        };
        if (declared > 0) {
          d.total = declared;
          d.n = hasSteps ? p.steps.length : 0;
          d.frac = Math.min(1, d.n / declared);
          d.mastered = !!(p.done || d.n >= declared);
          return d;
        }
        if (!hasQuiz) return d;
        d.total = p.quiz.total;
        d.n = typeof p.quiz.score === 'number' ? p.quiz.score : 0;
        d.need = passLine(d.total);
        d.frac = Math.min(1, d.n / d.total);
        d.mastered = d.n >= d.need;
        return d;
      }

      function derive(card, store) {
        var key = progKey(card);
        if (!key) return null;
        return deriveEntry(key, parseInt(card.dataset.total || '0', 10), store[key] || {});
      }

      /* courses.js 那条记录不是 DOM 卡片，但字段一一对应，用它也能算——
         分类看板与徽章判定走这里，卡片走 derive()，两条路共用同一个派生规则。 */
      function deriveCourse(c, store) {
        var key = c.progress || c.key;
        if (!key) return null;
        return deriveEntry(key, parseInt(c.total || '0', 10), store[key] || {});
      }

      function progressPct(card, store) {
        var d = derive(card, store);
        if (!d) return -1;
        return Math.round(d.frac * 100);
      }
      function sortCards() {
        var mode = document.getElementById('sortSel').value;
        var store = readProgress();
        var stars = readStars();
        var kids = Array.prototype.slice.call(grid.querySelectorAll('.card'));
        kids.sort(function (a, b) {
          /* 星标置顶：任何模式下收藏都排在最前 */
          var sa = stars.indexOf(progKey(a)) !== -1 ? 1 : 0;
          var sb = stars.indexOf(progKey(b)) !== -1 ? 1 : 0;
          if (sa !== sb) return sb - sa;
          if (mode === 'recent') {
            var la = (store[progKey(a)] && store[progKey(a)].last) || 0;
            var lb = (store[progKey(b)] && store[progKey(b)].last) || 0;
            return lb - la;
          }
          if (mode === 'progress') {
            var da = progressPct(a, store), db = progressPct(b, store);
            if (da !== db) return db - da;
          }
          return parseInt(a.dataset.oidx, 10) - parseInt(b.dataset.oidx, 10);
        });
        kids.forEach(function (el) { grid.appendChild(el); });
      }
      /* 星标点击：不触发卡片跳转 */
      grid.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.card-star') : null;
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        toggleStar(btn.dataset.star);
      });
      document.getElementById('sortSel').addEventListener('change', sortCards);

      /* Keyboard shortcut: / to focus search
       * 这条监听挂在 document 上，而模块与壳层在同一个文档里——过去只要
       * 按下 "/" 就 preventDefault + 抢焦点，于是模块内的输入框吃不到斜杠：
       * bash 迷你终端打 `ls /etc` 变成 `lsetc`，regex 模块打 `\d+\/x` 丢掉 `/`。
       * 这是"悄悄改写了用户输入"，比搜不到更糟，因为它看起来像是成功了。
       * 所以：光标在任何可编辑字段里时完全不管；只有导航页可见时才接管。 */
      function isTyping(el) {
        if (!el) return false;
        var tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
      }
      function navShowing() {
        var mv = document.getElementById('moduleView');
        return !mv || mv.hidden;
      }
      document.addEventListener('keydown', function (e) {
        var typing = isTyping(document.activeElement);
        /* Esc 在搜索框里清空——这条要在 typing 判断之前，因为搜索框自己就是 INPUT */
        if (e.key === 'Escape' && document.activeElement === searchInput) {
          searchInput.value = '';
          searchInput.blur();
          filter();
          return;
        }
        /* 焦点在模块的任何输入框里时，壳层完全不碰键盘 */
        if (typing) return;
        if (e.key === '/' && navShowing()) {
          e.preventDefault();
          searchInput.focus();
        }
      });

      /* ── Progress tracking (localStorage: il_progress) ── */
      function readProgress() {
        try { return JSON.parse(localStorage.getItem('il_progress') || '{}'); }
        catch (e) { return {}; }
      }

      /* ── 学习时长（Round 24）：只在壳层量，模块不掺和 ──
       * 为什么只有壳层能记：模块是同一个文档里的 <script>，读者切走时没有 unload，
       * 模块自己不知道"什么时候算离开"，更不知道页面是否被切到后台；壳层的
       * renderModule / cleanupModule 才是模块唯一的一对生灭点。
       *
       * 口径写死在这里，因为它会出现在四个地方（今日分钟 / 卡片累计 / 学习报告 / 热力图）：
       *   - 只在 `#/m/<key>` 且 document 可见时计时；切到后台立刻停，切回来重新起算；
       *   - 心跳 15s 结算一段，切模块 / 隐藏 / 卸载时补最后一段；
       *   - 单段上限 30s：系统睡眠唤醒时定时器会一次跳很久，不能把它算成学习；
       *   - 两本账：il_progress[key].ms（模块累计）+ il_time['YYYY-MM-DD']（按天累计），
       *     每一段由同一个 delta 同时写两处，所以"模块之和 == 每日之和"恒等；
       *     tools/check-behavior.js 量的就是这条恒等式（只写一处时界面不会报错，
       *     但"今日 N 分钟"会和报告里的模块时长对不上）。
       * 刻意不写 last：最后学习时间由 IL.touch 与测验落盘负责，计时不是"学习过"的证据。 */
      var TIME_KEY = 'il_time';
      var TIME_TICK_MS = 15000;
      var TIME_MAX_CHUNK = 30000;
      var timeKey = null, timeSince = 0, timeRunning = false;

      function readTimeMap() {
        try {
          var v = JSON.parse(localStorage.getItem(TIME_KEY) || '{}');
          return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
        } catch (e) { return {}; }
      }

      function dayKey(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
          '-' + String(d.getDate()).padStart(2, '0');
      }

      /* 只认真实存在的日历日：2026-02-30 与 2026-13-01 都不是"某一天"，
         留着它们只会让热力图多出一列永远亮不起来的格子。 */
      function isDayKey(k) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return false;
        var y = +k.slice(0, 4), m = +k.slice(5, 7), d = +k.slice(8, 10);
        var dt = new Date(y, m - 1, d);
        return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
      }

      /* 分钟粒度展示；不足一分钟说"不足 1 分钟"而不是四舍五入成 1 分钟——
         读者刚点开一个模块就看到"1 分钟"，这个数字就不可信了。 */
      function fmtDuration(ms) {
        var min = Math.floor(ms / 60000);
        if (min < 1) return ms > 0 ? '不足 1 分钟' : '0 分钟';
        if (min < 60) return min + ' 分钟';
        var h = Math.floor(min / 60), m = min % 60;
        return h + ' 小时' + (m ? ' ' + m + ' 分' : '');
      }

      function timeSuffix(p) {
        return p && typeof p.ms === 'number' && p.ms >= 60000 ? ' · ' + fmtDuration(p.ms) : '';
      }

      function commitStudyTime(key, delta) {
        if (!key) return;
        delta = Math.max(0, Math.min(Math.round(delta), TIME_MAX_CHUNK));
        var store = readProgress();
        var g = store[key] || {};
        if (delta === 0 && typeof g.ms === 'number') return;   /* 0 不写盘，但首次进门要落一个 ms:0 */
        var prev = typeof g.ms === 'number' && g.ms >= 0 ? g.ms : 0;
        g.ms = prev + delta;
        store[key] = g;
        try { localStorage.setItem('il_progress', JSON.stringify(store)); }
        catch (e) { /* storage unavailable */ }
        if (delta > 0) {
          var map = readTimeMap();
          var day = dayKey(new Date());
          map[day] = (typeof map[day] === 'number' ? map[day] : 0) + delta;
          try { localStorage.setItem(TIME_KEY, JSON.stringify(map)); }
          catch (e) { /* storage unavailable */ }
        }
      }

      function flushStudyTime() {
        if (timeKey === null || !timeRunning) return;
        var now = Date.now();
        commitStudyTime(timeKey, now - timeSince);
        timeSince = now;
      }
      function startStudyTime(key) {
        flushStudyTime();
        timeKey = key;
        /* 后台标签页里路由也可能变（新开链接 / 程序化跳转）：起算时先看可见性，
           否则要等到下一次 visibilitychange 才会停，隐藏期间会被心跳记进账。 */
        timeRunning = !document.hidden;
        timeSince = Date.now();
        commitStudyTime(key, 0);
      }
      function pauseStudyTime() { flushStudyTime(); timeRunning = false; }
      function resumeStudyTime() { if (timeKey !== null) { timeRunning = true; timeSince = Date.now(); } }
      function stopStudyTime() { flushStudyTime(); timeKey = null; timeRunning = false; }

      window.setInterval(function () { flushStudyTime(); reconcileSteps(); }, TIME_TICK_MS);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { pauseStudyTime(); reconcileSteps(); }
        else resumeStudyTime();
      });
      window.addEventListener('pagehide', function () { flushStudyTime(); reconcileSteps(); });

      /* ── 今日目标：给每个里程碑记下"解锁发生在哪一天"（Round 26） ──
       * 旧实现把"今天访问过的模块里全部 steps"加进今日目标（p.last 是今天 => += d.n），
       * 于是昨天已经解锁 9 步的模块，今天点开看一眼就变成"9 / 5 里程碑 · 已达成"。
       * 这和张旧复习条拿 last 当时钟是同一类错误：访问时间不是事件时间。
       *
       * 模块只写 steps（30 个模块各写各的），不知道也没必要知道"哪一天"。壳层在
       * 模块唯一的生灭点观察 steps 的增量，把新增下标的时间写进 stepAt：
       *   - 进入模块时记下现有 steps（beginStepSession）；
       *   - 15s 心跳 / 切后台 / 离开模块 / 卸载时对账（reconcileSteps），
       *     新增的才盖时间戳，已有的永远不动；
       *   - 今日目标只数 stepAt 落在今天的条目，与 last、与 steps 总量都无关。
       * 代价是解锁时间以壳层观测为准（最多晚 15s，离开时补记），跨午夜的一步可能
       * 记到次日；独立打开 src/ 调试页不经过壳层，不参与今日目标。 */
      var stepSessionKey = null, stepSeen = {};
      function beginStepSession(key) {
        stepSessionKey = key;
        stepSeen = {};
        var p = readProgress()[key];
        if (p && Array.isArray(p.steps)) p.steps.forEach(function (i) { stepSeen[i] = true; });
      }
      function reconcileSteps() {
        if (!stepSessionKey) return;
        var store = readProgress();
        var p = store[stepSessionKey];
        if (!p || !Array.isArray(p.steps)) return;
        var at = Date.now(), changed = false;
        if (!p.stepAt || typeof p.stepAt !== 'object' || Array.isArray(p.stepAt)) p.stepAt = {};
        p.steps.forEach(function (i) {
          if (stepSeen[i]) return;
          stepSeen[i] = true;
          if (typeof p.stepAt[i] !== 'number') { p.stepAt[i] = at; changed = true; }
        });
        if (!changed) return;
        store[stepSessionKey] = p;
        try { localStorage.setItem('il_progress', JSON.stringify(store)); }
        catch (e) { /* storage unavailable */ }
      }
      function endStepSession() {
        reconcileSteps();
        stepSessionKey = null;
        stepSeen = {};
      }
      function countTodaySteps(store) {
        var today = todayStr();
        var keys = {};
        courses.forEach(function (c) { keys[c.progress || c.key] = true; });
        var n = 0;
        Object.keys(store).forEach(function (key) {
          if (!keys[key]) return;
          var p = store[key];
          if (!p || !p.stepAt || typeof p.stepAt !== 'object') return;
          var unlocked = {};
          (Array.isArray(p.steps) ? p.steps : []).forEach(function (i) { unlocked[i] = true; });
          Object.keys(p.stepAt).forEach(function (i) {
            var ts = p.stepAt[i];
            if (unlocked[i] && typeof ts === 'number' && ts > 0 && dayKey(new Date(ts)) === today) n++;
          });
        });
        return n;
      }

      function initProgress() {
        var store = readProgress();
        var dayMs = readTimeMap()[dayKey(new Date())] || 0;
        var best = null;
        var doneCount = 0, goingCount = 0;
        var totalMs = 0, totalDoneMs = 0, quizCount = 0, quizDone = 0;

        /* 可重入：从模块返回导航页时会再次调用，先清掉上一轮的进度条 */
        cards.forEach(function (card) {
          card.querySelectorAll('.card-progress').forEach(function (el) { el.remove(); });
        });

        cards.forEach(function (card) {
          var d = derive(card, store);
          if (!d || !d.visited) return;
          var p = store[d.key];
          /* 两类模块的单位不同，各算各的：milestone 记"步"，assess 记"题"，
             合在一个数字里会读成"288 步只解锁了 200 步"，而真相是里程碑全
             解锁了、只是有测验没达标。 */
          if (d.kind === 'milestone') {
            /* 分母只算"真做过题"的里程碑模块：随手点开（IL.touch 只写 last）
               也把整站 288 步算进来，会读成"才解锁 3/288"，其实只开了一个模块。 */
            if (d.started) {
              totalMs += d.total;
              totalDoneMs += d.mastered ? d.total : d.n;
              var wrap = document.createElement('div');
              wrap.className = 'card-progress';
              wrap.innerHTML = '<span class="cp-track"><span class="cp-fill" style="width:' +
                Math.round(d.frac * 100) + '%"></span></span>' +
                '<span class="cp-label' + (d.mastered ? ' cp-done' : '') + '">' +
                (d.mastered ? '✓ 已完成' : '已解锁 ' + d.n + ' / ' + d.total + ' 步') +
                timeSuffix(p) + '</span>';
              card.appendChild(wrap);
            }
          } else {
            /* assess 型：进度条按测验得分率画。只点开过、还没交卷的
               （IL.touch 写了 last）也画出来并明说"仅访问过"，否则卡片
               一片空白，看不出它和"从没打开过"的区别。 */
            if (d.started) { quizCount++; if (d.mastered) quizDone++; }
            var qw = document.createElement('div');
            qw.className = 'card-progress';
            qw.innerHTML = '<span class="cp-track"><span class="cp-fill" style="width:' +
              Math.round(d.frac * 100) + '%"></span></span>' +
              '<span class="cp-label' + (d.mastered ? ' cp-done' : '') + '">' +
              (d.mastered ? '✓ 测验达标 · ' + d.n + '/' + d.total + ' 题'
                          : (d.started ? '测验 ' + d.n + '/' + d.total + ' 题 · 达标需 ' + d.need
                                        : '仅访问过 · 完成掌握度测验才算达标')) +
              timeSuffix(p) + '</span>';
            card.appendChild(qw);
          }

          if (d.mastered) doneCount++;
          else if (d.started) goingCount++;

          if (d.started && !d.mastered && (!best || (p.last || 0) > (best.p.last || 0))) {
            best = { d: d, p: p };
          }
        });

        if (best) {
          var target = cards.filter(function (c) { return progKey(c) === best.d.key; })[0];
          if (target) {
            var strip = document.getElementById('continueStrip');
            strip.href = target.getAttribute('href');
            document.getElementById('csTitle').textContent = target.querySelector('h3').textContent;
            document.getElementById('csMeta').textContent = (best.d.kind === 'milestone'
              ? '· 已解锁 ' + best.d.n + ' / ' + best.d.total + ' 步'
              : '· 测验 ' + best.d.n + '/' + best.d.total + ' 题 · 达标需 ' + best.d.need) +
              (best.p.ms >= 60000 ? ' · 累计 ' + fmtDuration(best.p.ms) : '');
            strip.classList.add('show');
          }
        }

        /* Progress overview
           访问过但还没做题的读者也要看到"今日分钟"：计时是本轮新增的、独立于
           里程碑/测验的反馈，藏在一个"0 进行中"的面板后面等于没做。 */
        if (doneCount + goingCount > 0 || dayMs > 0) {
          var tracked = 0;
          cards.forEach(function (c) { if (progKey(c)) tracked++; });
          var todoCount = tracked - doneCount - goingCount;
          var streak = computeStreak(store);
          var ov = document.getElementById('progressOverview');
          document.getElementById('ovStats').innerHTML =
            '<span class="ov-item ov-streak"><b>' + streak + '</b>连续学习</span>' +
            (dayMs > 0 ? '<span class="ov-item ov-time"><b>' +
              (dayMs >= 60000 ? Math.floor(dayMs / 60000) : '&lt;1') + '</b>今日分钟</span>' : '') +
            '<span class="ov-item ov-going"><b>' + goingCount + '</b>进行中</span>' +
            '<span class="ov-item ov-done"><b>' + doneCount + '</b>已完成</span>' +
            '<span class="ov-item ov-todo"><b>' + todoCount + '</b>未开始</span>';
          /* 两类模块的单位不同，分开报：把测验分数混进"里程碑"会读成
             "288 步里只解锁了 200 步"，而真相是里程碑全解锁了、只是有测验没达标。 */
          var msLine = '里程碑 ' + totalDoneMs + ' / ' + totalMs + ' 已解锁';
          if (quizCount) msLine += ' · 测验 ' + quizDone + ' / ' + quizCount + ' 个模块达标';
          document.getElementById('ovMilestones').textContent = (totalMs || quizCount) ? msLine : '';
          ov.classList.add('show');
        }

        renderCatBars(store);
        renderGoal(store);
        renderBadges(store);
        renderHeatmap(store);
        renderQuizTrend(store);
        renderWrongBook(store);

        renderReviewQueue(store);
      }

      /* ── 分类学习看板：掌握度 ──
       * 过去按"已解锁步数 / 总步数"算，分母取 c.total || 9——而没有里程碑的
       * 13 个模块根本写不出 steps，于是自动化分类（4 个模块全是 assess 型）
       * 满分学生也只读 0/36 步 · 0%。
       * 现在改成以"模块"为单位归一：每个模块贡献 0..1 的掌握度
       * （milestone 看里程碑解锁比例，assess 看测验得分比例，未开始记 0），
       * 两类单位不同但值域相同，可以直接平均。 */
      var CAT_COLORS = { devops: '#00ff41', cs: '#00ff41', automation: '#00ff41', tools: '#00ff41' };
      function renderCatBars(store) {
        var el = document.getElementById('ovCats');
        if (!el) return;
        var acc = {};
        Object.keys(CAT_COLORS).forEach(function (k) { acc[k] = { frac: 0, n: 0, mastered: 0 }; });
        courses.forEach(function (c) {
          var a = acc[c.cat];
          if (!a) return;
          var d = deriveCourse(c, store);
          a.n++;
          a.frac += d ? d.frac : 0;
          if (d && d.mastered) a.mastered++;
        });
        var any = Object.keys(acc).some(function (k) { return acc[k].frac > 0; });
        if (!any) { el.classList.remove('show'); return; }
        var html = '';
        Object.keys(acc).forEach(function (k) {
          var a = acc[k];
          if (!a.n) return;
          var pct = Math.round(a.frac / a.n * 100);
          html += '<div class="ov-cat"><span class="ov-cat-name">' + (CAT_LABEL[k] || k) + '</span>' +
            '<span class="ov-cat-bar"><span class="ov-cat-fill" style="width:' + pct + '%;background:' + CAT_COLORS[k] + '"></span></span>' +
            '<span class="ov-cat-num">' + a.mastered + ' / ' + a.n + ' 掌握 · ' + pct + '%</span></div>';
        });
        document.getElementById('ovCatsRows').innerHTML = html;
        el.classList.add('show');
      }

      /* ── 今日目标：每日里程碑目标（il_goal，按天生效） ── */
      function todayStr() {
        return dayKey(new Date());
      }
      function renderGoal(store) {
        var el = document.getElementById('ovGoal');
        if (!el) return;
        var goal = null;
        try {
          var g = JSON.parse(localStorage.getItem('il_goal') || 'null');
          if (g && g.date === todayStr() && g.target > 0) goal = g;
        } catch (e) { /* storage unavailable */ }
        var todaySteps = countTodaySteps(store);
        /* 今日目标只数"今天新解锁的里程碑"：stepAt 由壳层在模块生灭点与 15s
           心跳里补记。旧实现按"last 是今天的模块贡献全部 steps"累加，昨天解锁的
           9 步会在今天点开模块的瞬间全部算成今天——目标条自己会宣布"已达成"。
           assess 型模块没有里程碑，仍不计入；这是"里程碑目标"的单位决定的，
           不是把它们的测验折算成步数。 */
        var body = document.getElementById('ovGoalBody');
        if (!goal) {
          body.innerHTML = '<input type="number" id="goalInput" class="og-input" min="1" max="50" placeholder="今天想解锁几个里程碑？">' +
            '<button type="button" class="ov-btn" id="goalSave">设定</button><span class="og-note">按天生效，次日自动清零</span>';
          el.classList.add('show');
          var save = document.getElementById('goalSave');
          if (save) save.addEventListener('click', function () {
            var v = parseInt(document.getElementById('goalInput').value, 10);
            if (!v || v < 1) return;
            localStorage.setItem('il_goal', JSON.stringify({ date: todayStr(), target: Math.min(v, 50) }));
            renderGoal(store);
          });
          return;
        }
        var pct = Math.min(100, Math.round(todaySteps / goal.target * 100));
        var done = todaySteps >= goal.target;
        body.innerHTML = '<span class="og-bar"><span class="og-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="og-num' + (done ? ' og-done' : '') + '">' + todaySteps + ' / ' + goal.target + ' 里程碑' + (done ? ' · 已达成 ✓' : '') + '</span>' +
          '<button type="button" class="ov-btn" id="goalEdit">修改</button>';
        el.classList.add('show');
        var edit = document.getElementById('goalEdit');
        if (edit) edit.addEventListener('click', function () {
          localStorage.removeItem('il_goal');
          renderGoal(store);
        });
      }

      /* ── 错题本：聚合各模块 quiz.wrongs，错题优先，一键重学 ── */
      function renderWrongBook(store) {
        var el = document.getElementById('ovWrong');
        if (!el) return;
        var items = [];
        cards.forEach(function (card) {
          var key = progKey(card);
          if (!key) return;
          var p = store[key];
          if (!p || !p.quiz || !Array.isArray(p.quiz.wrongs) || !p.quiz.wrongs.length) return;
          var title = card.querySelector('h3');
          items.push({ key: key, name: title ? title.textContent : key, n: p.quiz.wrongs.length, score: p.quiz.score, total: p.quiz.total, href: card.getAttribute('href') });
        });
        if (!items.length) return;
        items.sort(function (a, b) { return b.n - a.n; });
        var html = items.map(function (it) {
          return '<a class="ow-item" href="' + it.href + '" title="上次测验 ' + it.score + '/' + it.total + '，' + it.n + ' 题答错">' +
            '<b>' + it.n + '</b><span class="ow-name">' + esc(it.name) + '</span>' +
            '<span class="ow-meta">' + it.score + '/' + it.total + '</span></a>';
        }).join('');
        document.getElementById('ovWrongGrid').innerHTML = html;
        document.getElementById('ovWrongMeta').textContent = items.length + ' 个模块有待复习错题 · 进入模块后错题优先重做';
        el.classList.add('show');
      }

      /* ── 连续学习天数：聚合所有模块 last 时间戳的去重日期 ── */
      /* ── 成就徽章：按进度/连学/精通/满分自动解锁（il_badges） ── */
      var BADGES = [
        { id: 'streak3', icon: '&#x1F525;', name: '连学 3 天', req: '连续学习天数 ≥ 3' },
        { id: 'streak7', icon: '&#x1F3C5;', name: '连学 7 天', req: '连续学习天数 ≥ 7' },
        { id: 'master1', icon: '&#x1F3C6;', name: '首个精通', req: '掌握任意 1 个模块（里程碑全解锁，或测验得分率 ≥ 75%）' },
        { id: 'master3', icon: '&#x1F48E;', name: '三连精通', req: '掌握 3 个模块' },
        { id: 'catPioneer', icon: '&#x1F3AF;', name: '分类先锋', req: '同一分类掌握 ≥ 2 个模块' },
        { id: 'perfect', icon: '&#x2705;', name: '测验满分', req: '任意模块测验全对' },
        { id: 'quizAvg7', icon: '&#x1F4AF;', name: '测验学霸', req: '已完成测验的平均得分率 ≥ 7/8' },
        { id: 'halfway', icon: '&#x1F4DA;', name: '半程达成', req: '掌握模块数 ≥ 全部模块一半' },
        { id: 'finisher', icon: '&#x1F3C1;', name: '全站通关', req: '掌握全部 ' + courses.length + ' 个模块' }
      ];

      function evaluateBadges(store) {
        var doneCount = 0, tracked = 0;
        var catDone = {};
        courses.forEach(function (c) {
          var d = deriveCourse(c, store);
          if (!d) return;
          tracked++;
          if (d.mastered) {
            doneCount++;
            catDone[c.cat] = (catDone[c.cat] || 0) + 1;
          }
        });
        var streak = computeStreak(store);
        var perfect = Object.keys(store).some(function (k) {
          var q = store[k] && store[k].quiz;
          return q && q.total && q.score === q.total;
        });
        var quizRates = [];
        Object.keys(store).forEach(function (k) {
          var q = store[k] && store[k].quiz;
          if (q && q.total && typeof q.score === 'number') quizRates.push(q.score / q.total);
        });
        /* 题库长度 5~12 不等，拿原始平均分当 "≥7/8" 会两头出错：只做
           makefile（5 题）满分是 5 分、永不达标，只做 12 题模块蒙对一半就 6 分。
           归一到得分率再比 7/8 = 87.5%，才是徽章字面说的那件事。 */
        var quizAvg = quizRates.length ? quizRates.reduce(function (a, b) { return a + b; }, 0) / quizRates.length : 0;
        var catPioneer = Object.keys(catDone).some(function (k) { return catDone[k] >= 2; });
        return {
          streak3: streak >= 3,
          streak7: streak >= 7,
          master1: doneCount >= 1,
          master3: doneCount >= 3,
          catPioneer: catPioneer,
          perfect: perfect,
          quizAvg7: quizRates.length > 0 && quizAvg >= 7 / 8,
          halfway: tracked > 0 && doneCount >= Math.ceil(tracked / 2),
          finisher: tracked > 0 && doneCount >= tracked
        };
      }

      function renderBadges(store) {
        var el = document.getElementById('ovBadges');
        if (!el) return;
        var res = evaluateBadges(store);
        var unlocked = [];
        try { unlocked = JSON.parse(localStorage.getItem('il_badges') || '[]'); }
        catch (e) { unlocked = []; }
        var newly = BADGES.filter(function (b) { return res[b.id] && unlocked.indexOf(b.id) === -1; });
        if (newly.length) {
          unlocked = BADGES.filter(function (b) { return res[b.id]; }).map(function (b) { return b.id; });
          try { localStorage.setItem('il_badges', JSON.stringify(unlocked)); } catch (e) { /* storage unavailable */ }
          toast('🏅 解锁成就：' + newly.map(function (b) { return b.name; }).join('、'));
        }
        var row = document.getElementById('ovBadgesRow');
        row.innerHTML = BADGES.map(function (b) {
          var on = !!res[b.id];
          return '<span class="badge-chip ' + (on ? 'unlocked' : 'locked') + '" title="' + esc(b.req) + '">' +
            '<span class="b-ico">' + b.icon + '</span>' + esc(b.name) + (on ? ' &#10003;' : '') + '</span>';
        }).join('');
        document.getElementById('ovBadgesCount').textContent = '· ' + unlocked.length + ' / ' + BADGES.length + ' 已解锁';
        el.classList.add('show');
      }

      /* ── 学习热力图：近 90 天 GitHub 风格日历 ──
       * Round 24 起有分钟就按分钟分档（10/30/60 分钟三刀），没有 il_time 的旧数据
       * 仍按"当天学过几个模块"分档——升级不该把读者过去 90 天的格子抹平。
       * 同一天两者都有时以分钟为准：那是本轮开始记录的真数字。 */
      function renderHeatmap(store) {
        var el = document.getElementById('ovHeat');
        if (!el) return;
        var counts = {};
        Object.keys(store).forEach(function (k) {
          var p = store[k];
          if (p && p.last) {
            var ds = new Date(p.last).toDateString();
            counts[ds] = (counts[ds] || 0) + 1;
          }
        });
        var timeMap = readTimeMap();
        var totalStudy = 0;
        Object.keys(timeMap).forEach(function (k) {
          if (typeof timeMap[k] === 'number') totalStudy += timeMap[k];
        });
        var today = new Date(); today.setHours(0, 0, 0, 0);
        var start = new Date(today); start.setDate(start.getDate() - 89);
        var dow = (start.getDay() + 6) % 7; /* 周一起始 */
        start.setDate(start.getDate() - dow);
        var cells = [];
        var d = new Date(start);
        while (d <= today) {
          var key = dayKey(d);
          cells.push({
            key: d.toDateString(), n: counts[d.toDateString()] || 0,
            ms: typeof timeMap[key] === 'number' ? timeMap[key] : 0,
            ymd: key, date: new Date(d)
          });
          d.setDate(d.getDate() + 1);
        }
        var grid = '';
        for (var c = 0; c < cells.length; c += 7) {
          var col = cells.slice(c, c + 7);
          grid += '<div class="hm-col">' + col.map(function (cell) {
            var lvl;
            if (cell.ms > 0) lvl = cell.ms < 600000 ? 1 : cell.ms < 1800000 ? 2 : cell.ms < 3600000 ? 3 : 4;
            else lvl = cell.n === 0 ? 0 : Math.min(4, cell.n);
            var label = cell.ms > 0 ? fmtDuration(cell.ms) : cell.n + ' 次学习';
            return '<span class="hm-cell l' + lvl + '" title="' + cell.ymd + '：' + label + '"></span>';
          }).join('') + '</div>';
        }
        document.getElementById('ovHeatGrid').innerHTML = grid;
        var activeDays = cells.filter(function (cell) { return cell.n > 0 || cell.ms > 0; }).length;
        if (activeDays === 0) return; /* 无学习记录时不展示热力图 */
        document.getElementById('ovHeatMeta').textContent = '近 90 天活跃 ' + activeDays + ' 天' +
          (totalStudy > 0 ? ' · 累计 ' + fmtDuration(totalStudy) : '');
        el.classList.add('show');
      }

      /* ── 测验成绩趋势：聚合各模块 quiz 成绩 ── */
      function renderQuizTrend(store) {
        var el = document.getElementById('ovQuiz');
        if (!el) return;
        var rows = [];
        cards.forEach(function (card) {
          var key = progKey(card);
          if (!key) return;
          var p = store[key];
          if (p && p.quiz && p.quiz.total) {
            var title = card.querySelector('h3');
            rows.push({ name: title ? title.textContent : key, score: p.quiz.score, total: p.quiz.total });
          }
        });
        if (!rows.length) return;
        rows.sort(function (a, b) { return (b.score / b.total) - (a.score / a.total); });
        var totalPct = 0;
        var html = rows.map(function (r) {
          var pct = Math.round(r.score / r.total * 100);
          totalPct += pct;
          return '<div class="qz-row"><span class="qz-name">' + esc(r.name) + '</span>' +
            '<span class="qz-bar"><span class="qz-fill" style="width:' + pct + '%"></span></span>' +
            '<span class="qz-num">' + r.score + '/' + r.total + '</span></div>';
        }).join('');
        document.getElementById('ovQuizRows').innerHTML = html;
        var avg = Math.round(totalPct / rows.length);
        document.getElementById('ovQuizMeta').textContent = rows.length + ' 个模块完成测验 · 平均 ' + avg + ' 分';
        el.classList.add('show');
      }

      /* ── 连续学习天数：聚合所有模块 last 时间戳的去重日期 ── */
      function computeStreak(store) {
        var days = {};
        Object.keys(store).forEach(function (k) {
          var last = store[k] && store[k].last;
          if (last) days[new Date(last).toDateString()] = true;
        });
        if (!Object.keys(days).length) return 0;
        var cur = new Date();
        if (!days[cur.toDateString()]) cur.setDate(cur.getDate() - 1); /* 今天未学则从昨天起算 */
        var streak = 0;
        while (days[cur.toDateString()]) { streak++; cur.setDate(cur.getDate() - 1); }
        return streak;
      }
      var REVIEW_DAY = 86400000;
      /* ── 复习排期：间隔由"最近一次交卷"与掌握状态推导 ──
       * 旧规则是两条写死的线（进行中 3 天、已掌握 7 天），时钟读的是 p.last——
       * 而 IL.touch 每次进入模块都会写 last，于是"点开看一眼再退出"就等于复习过，
       * 真正该复习的模块被自己的访问记录推出了队列。Round 25 把时钟换成
       * quiz.at（交卷时间，IL.record / IL.quiz 落盘）；没有这个字段的旧数据
       * 回退到 last，下一次交卷后自动换轨。
       * 间隔是纯函数，不新增存储字段：改规则后历史数据立即按新节奏重排。
       * 判据见 tools/check-behavior.js 的"复习队列"一节。 */
      var REVIEW_SPACING = {
        visited: 7,   /* 只打开过、没交过卷：7 天后轻提一次 */
        weak: 1,      /* 交过卷但得分率 < 50%：明天再来 */
        doing: 3,     /* 进行中（含只解锁了部分里程碑的） */
        solid: 7,     /* 已掌握 */
        perfect: 14   /* 已掌握且测验满分 */
      };
      function reviewClock(p) {
        if (p.quiz && typeof p.quiz.at === 'number' && p.quiz.at > 0) return p.quiz.at;
        return p.last || 0;
      }
      function reviewPlan(d, p) {
        var rate = (p.quiz && p.quiz.total > 0) ? p.quiz.score / p.quiz.total : null;
        var days, why;
        /* 顺序即优先级：满分 > 已掌握 > 薄弱 > 进行中 > 仅访问。
           "满分"排在掌握之前，是因为它在两类模块上都可比：assess 型的掌握本来
           就是看测验，milestone 型的 steps 只说明读过、说明不了记得住。 */
        if (!d.started) { days = REVIEW_SPACING.visited; why = '仅访问过'; }
        else if (rate === 1) { days = REVIEW_SPACING.perfect; why = '测验满分'; }
        else if (d.mastered) { days = REVIEW_SPACING.solid; why = '已掌握'; }
        else if (rate !== null && rate < 0.5) { days = REVIEW_SPACING.weak; why = '薄弱'; }
        else { days = REVIEW_SPACING.doing; why = '进行中'; }
        return { days: days, why: why, rate: rate };
      }
      function rateText(p) {
        if (!p.quiz || !p.quiz.total) return '';
        return '测验 ' + p.quiz.score + '/' + p.quiz.total;
      }

      /* 队列的展开状态跨 initProgress 保留：读者点进模块再返回，面板不会被
         重渲染悄悄收起来（重渲染本身是必须的，进度可能刚变过）。 */
      var reviewOpen = false;
      function setReviewOpen(open) {
        reviewOpen = open;
        var strip = document.getElementById('reviewStrip');
        var panel = document.getElementById('reviewPanel');
        if (!strip || !panel) return;
        strip.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.getElementById('rsGoText').textContent = open ? '收起' : '展开队列';
        panel.classList.toggle('show', open);
      }

      function renderReviewQueue(store) {
        var now = Date.now();
        var due = [], ahead = [];
        cards.forEach(function (card) {
          var key = progKey(card);
          if (!key) return;
          var p = store[key];
          if (!p) return;
          var d = derive(card, store);
          if (!d || !d.visited) return;
          var clock = reviewClock(p);
          if (!clock) return;
          var plan = reviewPlan(d, p);
          var elapsed = Math.floor((now - clock) / REVIEW_DAY);
          var left = plan.days - elapsed;   /* > 0：还有几天到期；<= 0：已到期 */
          var row = { card: card, key: key, p: p, plan: plan, elapsed: elapsed,
            left: left, over: Math.max(0, -left),
            hasAt: !!(p.quiz && typeof p.quiz.at === 'number' && p.quiz.at > 0) };
          (left <= 0 ? due : ahead).push(row);
        });

        var wrap = document.getElementById('reviewWrap');
        /* 一份进度都没有：整块不出现，不给空状态占地方 */
        if (!due.length && !ahead.length) {
          wrap.hidden = true;
          setReviewOpen(false);
          return;
        }
        wrap.hidden = false;

        /* 逾期最久的排最前；同一天到期时按间隔短（更需要复习）与课程原始顺序，
         * 保证同一份数据每次渲染顺序一致。 */
        due.sort(function (a, b) {
          return b.over - a.over || a.plan.days - b.plan.days ||
            parseInt(a.card.dataset.oidx, 10) - parseInt(b.card.dataset.oidx, 10);
        });
        ahead.sort(function (a, b) {
          return a.left - b.left || parseInt(a.card.dataset.oidx, 10) - parseInt(b.card.dataset.oidx, 10);
        });

        if (due.length) {
          var worst = due[0];
          document.getElementById('rsTitle').textContent = '今日复习';
          document.getElementById('rsMeta').textContent = due.length + ' 个模块待复习 · ' +
            (worst.over > 0 ? '最久逾期 ' + worst.over + ' 天' : '今天到期');
        } else {
          var next = ahead[0];
          document.getElementById('rsTitle').textContent = '复习节奏';
          document.getElementById('rsMeta').textContent = '暂无到期 · 下次复习：' +
            (next.left <= 1 ? '明天' : next.left + ' 天后') + ' · ' +
            next.card.querySelector('h3').textContent;
        }

        /* 展开后：有到期就列到期；全都没到期就把最近的几次排期列出来。
           行内的"间隔"与"上次交卷"是这张表存在的理由——读者能看出为什么是今天。 */
        var listed = due.length ? due : ahead.slice(0, 6);
        document.getElementById('rpList').innerHTML = listed.map(function (r) {
          var title = r.card.querySelector('h3').textContent;
          var cat = r.card.dataset.cat || '';
          var rate = rateText(r.p);
          var stamp = r.hasAt ? '上次交卷 ' : '上次访问 ';
          var dueLabel = due.length
            ? (r.over > 0 ? '逾期 ' + r.over + ' 天' : '今天到期')
            : (r.left <= 1 ? '明天' : r.left + ' 天后');
          return '<a class="rp-item' + (due.length ? '' : ' ahead') + '" href="' +
            r.card.getAttribute('href') + '">' +
            '<span class="rp-main"><span class="rp-title">' + esc(title) + '</span>' +
            (cat ? '<span class="badge" data-b="' + esc(cat) + '">' + esc(CAT_LABEL[cat] || cat) + '</span>' : '') +
            '</span>' +
            '<span class="rp-due">' + dueLabel + '</span>' +
            '<span class="rp-meta">' + r.plan.why + (rate ? ' · ' + rate : '') +
            ' · 间隔 ' + r.plan.days + ' 天 · ' + stamp + r.elapsed + ' 天前</span>' +
            '</a>';
        }).join('');

        /* 面板每次都按 reviewOpen 复位：initProgress 会在返回导航页时重跑 */
        setReviewOpen(reviewOpen);
      }

      /* ── 学习档案备份：导出 / 导入全部本地状态 ──
         Round 20 遗留第 6 条：旧实现只搬 il_progress，按钮却写着"导出进度"。
         收藏（il_star）、成就（il_badges）、今日目标（il_goal）、主题（il_theme）
         全不在那份文件里——换浏览器或清一次缓存，丢的不止进度，是整个学习档案，
         而且一声不吭。现在备份是一个 envelope，键清单由 tools/check-courses.js
         第 9 节拿代码里所有 localStorage 字面量键对账：新增一个写入点却没在这儿
         登记（也没写进 IL_NOBACKUP_KEYS），CI 直接红——"少备一样"这件事从此
         需要有人主动签字，不会再静默发生。
         这张表现在还回答第三件事：重置时哪些键跟着进度一起清空（clearOnReset）。
         旧重置手写 il_progress / il_time，建站仿真进度和成就留在库里，按钮说
         "清空全部"却留下半个档案；把决定放回同一张表，漏签由 check-courses 拦。 */
      var IL_BACKUP_KEYS = [
        { key: 'il_progress', codec: 'json', label: '学习进度', clearOnReset: true },
        { key: 'il_time',     codec: 'json', label: '学习时长', clearOnReset: true },
        { key: 'il_star',     codec: 'json', label: '收藏', clearOnReset: false },
        { key: 'il_badges',   codec: 'json', label: '成就', clearOnReset: true },
        { key: 'il_goal',     codec: 'json', label: '今日目标', clearOnReset: true },
        { key: 'il_theme',    codec: 'raw',  label: '主题偏好', clearOnReset: false },
        /* web 模块的建站仿真自己存了一份进度（键名不带 il_ 前缀）。第 9 节对账把
           它揪出来的：它在库里活着，却不在任何一份备份里。 */
        { key: 'website-simulation-progress', codec: 'json', label: '建站仿真进度', clearOnReset: true }
      ];
      /* 明确不备份的键写在这里并说明理由；留空也要留着，它和上面那张表是同一句话的两半 */
      var IL_NOBACKUP_KEYS = [];
      var BACKUP_APP = 'interactive-learning';
      var BACKUP_VERSION = 1;

      function readBackupValue(b) {
        var raw = null;
        try { raw = localStorage.getItem(b.key); } catch (e) { return null; }
        if (raw === null || raw === '') return null;
        if (b.codec !== 'json') return raw;
        /* 解析不了的原样带上，别在"导出"这一步就把读者的数据弄丢——导入侧会再判一次 */
        try { return JSON.parse(raw); } catch (e) { return raw; }
      }

      function exportBackup() {
        var data = {};
        IL_BACKUP_KEYS.forEach(function (b) {
          var v = readBackupValue(b);
          if (v !== null) data[b.key] = v;
        });
        var body = JSON.stringify({
          app: BACKUP_APP, kind: 'backup', version: BACKUP_VERSION,
          savedAt: new Date().toISOString(),
          keys: Object.keys(data), data: data
        });
        var blob = new Blob([body], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'il-backup-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
      }

      /* il_progress 逐条校验（Round 20 的口径原样保留）：steps 是落在 [0,total) 的
         整数、quiz 是 {score,total,wrongs} 数字、last 是数字、done 是布尔。
         不合格的条目丢掉并计数，一个都不剩就拒收，不碰现有数据。
         写回时**按文件里原本的字段顺序**——字节相等既是行为闸门的断言，也是读者
         拿两份备份做 diff 时的体验；第一版按固定顺序重建对象，长度一样、字节不一样。 */
      function cleanProgress(obj) {
        var known = {};
        courses.forEach(function (c) { known[c.key] = (typeof c.total === 'number') ? c.total : null; });
        var clean = {}, kept = 0, dropped = [];
        Object.keys(obj).forEach(function (key) {
          var g = obj[key];
          if (!known.hasOwnProperty(key) || !g || typeof g !== 'object') { dropped.push(key); return; }
          var out = {};
          var okShape = true;
          Object.keys(g).forEach(function (field) {
            if (!okShape) return;
            var v = g[field];
            if (field === 'steps') {
              if (!Array.isArray(v) || v.some(function (i) { return typeof i !== 'number' || i % 1 !== 0 || i < 0; })) okShape = false;
              else out.steps = v;
            } else if (field === 'quiz') {
              if (!v || typeof v !== 'object' || typeof v.score !== 'number' || typeof v.total !== 'number' ||
                  (v.wrongs !== undefined && (!Array.isArray(v.wrongs) || v.wrongs.some(function (w) { return typeof w !== 'number'; })))) { okShape = false; return; }
              var q = {};
              Object.keys(v).forEach(function (qk) {
                if (qk === 'wrongs') q.wrongs = v.wrongs ? v.wrongs.slice() : [];
                else if (qk === 'score' || qk === 'total') q[qk] = v[qk];
                else if (qk === 'at') {
                  /* 交卷时间戳：复习队列的时钟（Round 25）。它不在白名单里的
                     下场和 ms 一样——导入一次备份，全部模块的复习节奏回到
                     "按上次访问算"，而界面上什么都看不出来。 */
                  if (typeof v.at !== 'number' || v.at % 1 !== 0 || v.at < 0) okShape = false;
                  else q.at = v.at;
                }
              });
              out.quiz = q;
            } else if (field === 'last') {
              if (typeof v !== 'number') okShape = false; else out.last = v;
            } else if (field === 'ms') {
              /* 学习时长是 Round 24 的新字段：整数毫秒、非负、上限十年。
                 不认识的字段照旧丢掉；认得的字段必须在白名单里——否则导入一次
                 备份就把读者的时长清空，界面上还看不出少了一样东西。 */
              if (typeof v !== 'number' || v % 1 !== 0 || v < 0 || v > 315360000000) okShape = false;
              else out.ms = v;
            } else if (field === 'stepAt') {
              /* 里程碑解锁时间（Round 26）：今日目标只数今天的条目。
                 漏了这个白名单，导入一次备份就把全库"今天解锁了几步"清零，
                 而目标条只会安静地读成 0——与 ms / quiz.at 是同一个坑。
                 键必须是该模块的合法步下标（声明了 total 的模块还要小于 total），
                 值是整数时间戳。 */
              if (!v || typeof v !== 'object' || Array.isArray(v)) { okShape = false; return; }
              var sa = {};
              Object.keys(v).forEach(function (sk) {
                var si = Number(sk);
                if (!/^\d+$/.test(sk) || si % 1 !== 0 || si < 0 ||
                    (known[key] !== null && si >= known[key]) ||
                    typeof v[sk] !== 'number' || v[sk] % 1 !== 0 || v[sk] < 0) {
                  okShape = false;
                  return;
                }

            } else if (field === 'done') {
              if (typeof v !== 'boolean') okShape = false; else out.done = v;
            }
            /* 其它字段：壳层不读，丢掉 */
          });
          if (!okShape) { dropped.push(key); return; }
          /* stepAt 只对"当前仍在 steps 里的下标"有意义：导入一份被手工拼过的
             备份时，多出来的时间戳会让今日目标凭空回涨。孤儿时间戳直接丢掉。 */
          if (out.stepAt) {
            var unlocked = {};
            (out.steps || []).forEach(function (i) { unlocked[i] = true; });
            Object.keys(out.stepAt).forEach(function (i) {
              if (!unlocked[i]) delete out.stepAt[i];
            });
            if (!Object.keys(out.stepAt).length) delete out.stepAt;
          }
          clean[key] = out; kept++;
        });
        return { value: clean, kept: kept, dropped: dropped };
      }

      /* 每个键按它自己的结构校验，认不出的整条丢掉并计数（dropped 一律是数组，
         导入侧按它报错数——第一版在这里混用过"数字"和"数组"，forEach 当场炸）。
         收藏只认 courses.js 里的 key、成就只认 BADGES 里的 id：别的数据进来
         不是"备份文件更宽"，是"这份文件不是本库的"。 */
      var BACKUP_CLEANERS = {
        il_progress: function (v) {
          if (!v || typeof v !== 'object' || Array.isArray(v)) return null;
          var r = cleanProgress(v);
          return r.kept ? r : null;
        },
        il_time: function (v) {
          /* 按天累计：键必须是真实日历日，值是一天内的整数毫秒（上限 24h）。
             一天的时长超过 24h 只能是数据坏了，不是"读者特别刻苦"。 */
          if (!v || typeof v !== 'object' || Array.isArray(v)) return null;
          var clean = {}, kept = 0, dropped = [];
          Object.keys(v).forEach(function (k) {
            var ms = v[k];
            if (!isDayKey(k) || typeof ms !== 'number' || ms % 1 !== 0 || ms < 0 || ms > 86400000) {
              dropped.push(k);
              return;
            }
            clean[k] = ms; kept++;

          return kept ? { value: clean, kept: kept, dropped: dropped } : null;
        },
        il_star: function (v) {
          if (!Array.isArray(v)) return null;
          var known = {};
          courses.forEach(function (c) { known[c.key] = true; });
          var keep = [], drop = [];
          v.forEach(function (k) {
            if (typeof k === 'string' && known[k] === true) keep.push(k); else drop.push(String(k));
          });
          return { value: keep, kept: keep.length, dropped: drop };
        },
        il_badges: function (v) {
          if (!Array.isArray(v)) return null;
          var ids = {};
          BADGES.forEach(function (b) { ids[b.id] = true; });
          var keep = [], drop = [];
          v.forEach(function (id) {
            if (typeof id === 'string' && ids[id] === true) keep.push(id); else drop.push(String(id));
          });
          return { value: keep, kept: keep.length, dropped: drop };
        },
        il_goal: function (v) {
          if (!v || typeof v !== 'object' || typeof v.date !== 'string' ||
              typeof v.target !== 'number' || v.target < 1) return null;
          return { value: { date: v.date, target: Math.min(v.target, 50) }, kept: 1, dropped: [] };
        },
        il_theme: function (v) {
          if (typeof v !== 'string' || ['auto', 'dark', 'light'].indexOf(v) === -1) return null;
          return { value: v, kept: 1, dropped: [] };
        }
      };
      /* 建站仿真进度：结构与 schema 属于 web 模块自己，壳层只认"是一个 JSON 对象"。
         这条比对另外几行弱，但它存在的理由是**别静默漏掉**：备份覆盖到哪几个键由
         IL_BACKUP_KEYS 说话，而这张表由 tools/check-courses.js 第 9 节和代码对账。 */
      BACKUP_CLEANERS['website-simulation-progress'] = function (v) {
        if (!v || typeof v !== 'object' || Array.isArray(v)) return null;
        var n = Object.keys(v).length;
        if (!n) return null;
        return { value: v, kept: n, dropped: [] };
      };

      function backupCodec(key) {
        var found = null;
        IL_BACKUP_KEYS.forEach(function (b) { if (b.key === key) found = b; });
        return found;
      }
      function decodeBackup(b, raw) {
        if (b.codec !== 'json') return raw;
        try { return JSON.parse(raw); } catch (e) { return raw; }
      }
      function describeBackup(b, value) {
        if (b.key === 'il_progress') return b.label + ' ' + Object.keys(value || {}).length + ' 个模块';
        if (b.key === 'il_time') {
          var days = 0, total = 0;
          Object.keys(value || {}).forEach(function (k) {
            if (typeof value[k] === 'number') { days++; total += value[k]; }
          });
          return b.label + ' ' + days + ' 天 · ' + fmtDuration(total);
        }
        if (Array.isArray(value)) return b.label + ' ' + value.length + ' 项';
        if (b.key === 'il_goal' && value) return b.label + ' ' + value.target + '（' + value.date + '）';
        if (b.key === 'il_theme') return b.label + ' ' + value;
        return b.label;
      }

      function importBackupFile(file) {
        var r = new FileReader();
        r.onload = function () {
          var obj;
          try {
            obj = JSON.parse(String(r.result));
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('not-object');
          } catch (e) {
            alert('导入失败：文件不是有效的备份 JSON');
            return;
          }
          /* 新格式是 envelope（{app, kind, version, data}）；Round 20 及更早的扁平
             进度备份（顶层就是 {模块key: {...}}）照旧认——读者手里的旧文件不是垃圾。 */
          var isArchive = obj.app === BACKUP_APP && obj.kind === 'backup' &&
            obj.data && typeof obj.data === 'object' && !Array.isArray(obj.data);
          var payload = isArchive ? obj.data : { il_progress: obj };
          var write = [], unknown = [];
          Object.keys(payload).forEach(function (key) {
            var b = backupCodec(key);
            if (!b || !BACKUP_CLEANERS[key]) { unknown.push(key); return; }
            var res = BACKUP_CLEANERS[key](payload[key]);
            if (!res) { unknown.push(key); return; }
            res.dropped.forEach(function (d) { unknown.push(key + '.' + d); });
            write.push({ b: b, key: key, res: res,

          });
          if (!write.length) {
            alert('导入失败：文件里没有一条是本库的本地数据' +
              (unknown.length ? '（丢弃 ' + unknown.length + ' 项）' : ''));
            return;
          }
          /* 完整档案是快照，不是合并：档案里没有的已登记键 = 导出时本来就没有，
             导入后应删除；否则"恢复旧备份"会留下导出之后才产生的数据（比如
             il_time 还在、il_progress 已回到过去，两本账当场对不上）。
             旧版扁平备份（顶层就是进度）只含 il_progress，保持合并语义——读者
             手里的旧文件不是垃圾，但它也不能冒充一份完整快照去删别的档案。 */
          var removals = [];
          if (isArchive) {
            IL_BACKUP_KEYS.forEach(function (b) {
              if (Object.prototype.hasOwnProperty.call(payload, b.key)) return;
              var had = null;
              try { had = localStorage.getItem(b.key); } catch (e) { had = null; }
              if (had !== null && had !== '') removals.push(b);
            });
          }
          /* 覆盖之前把两边都念一遍：旧的"覆盖 N 个进度"只说得清 il_progress，
             而现在会被动到的是整个学习档案。 */
          var cur = [], inc = [];
          write.forEach(function (w) {
            inc.push(describeBackup(w.b, w.res.value));
            var had = null;
            try { had = localStorage.getItem(w.key); } catch (e) { had = null; }
            if (had !== null && had !== '') cur.push(describeBackup(w.b, decodeBackup(w.b, had)));
          });
          var ignored = unknown.length ? '\n  忽略文件里 ' + unknown.length + ' 项不认的数据' : '';
          var lost = removals.length ? '\n  档案未包含这些本地数据，导入后将删除：' +
            removals.map(function (b) { return b.label; }).join(' / ') : '';
          var mergeNote = isArchive ? '' : '\n  旧版进度备份：只覆盖学习进度，其它本地档案保留';
          if ((cur.length || removals.length) &&
              !confirm('导入会覆盖当前本地数据：\n  现有：' + cur.join('；') +
                '\n  读入：' + inc.join('；') + lost + mergeNote + ignored + '\n继续？')) return;
          write.forEach(function (w) {
            try { localStorage.setItem(w.key, w.raw); } catch (e) { /* storage unavailable */ }
          });
          removals.forEach(function (b) {
            try { localStorage.removeItem(b.key); } catch (e) { /* storage unavailable */ }
          });
          location.reload();
        };
        r.readAsText(file);
      }

      /* ── 学习报告：il_progress + 课程元数据 → Markdown 下载 ── */
      function fmtDate(ts) {
        if (!ts) return '—';

        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      }
      function exportReport() {
        var store = {};

        catch (e) { store = {}; }
        var catNames = { devops: 'DevOps', cs: '计算机科学', automation: '自动化', tools: '效率工具' };
        var lines = [];
        lines.push('# 交互式学习 · 学习报告');
        lines.push('');

        lines.push('');

        var rows = courses.map(function (c) {
          var d = deriveCourse(c, store);
          if (!d) return null;
          var p = store[d.key] || {};
          tracked++;
          if (d.mastered) doneCount++;
          if (typeof p.ms === 'number' && p.ms > 0) studyMs += p.ms;
          /* 题库长度不统一（5~12 题），"平均 x/8" 对一半模块是假数字。
             改成平均得分率，与 ilquiz 的达标线同一口径。 */
          var quizTxt = '—';
          if (p.quiz && p.quiz.total) {
            quizTxt = p.quiz.score + '/' + p.quiz.total;

          }

            : (d.started ? '进行中' : (d.visited ? '仅访问' : '未开始'));

              : (d.total ? '测验 ' + d.n + '/' + d.total : '—'),
            quiz: quizTxt,
            time: (typeof p.ms === 'number' && p.ms > 0) ? fmtDuration(p.ms) : '—',
            last: fmtDate(p.last)
          };

        var pct = tracked ? Math.round(doneCount / tracked * 100) : 0;
        var quizAvgTxt = quizDone ? Math.round(quizRate / quizDone * 100) + '%' : '—';
        lines.push('## 概览');
        lines.push('');
        lines.push('- 模块总数：' + tracked);
        lines.push('- 已掌握：' + doneCount + '（' + pct + '%）· 判定口径：里程碑型看全部解锁，测验型看得分率 ≥ 75%');
        lines.push('- 测验完成：' + quizDone + ' 个模块，平均得分率 ' + quizAvgTxt);
        lines.push('- 累计学习时长：' + (studyMs > 0 ? fmtDuration(studyMs) : '—') +
          '（模块内可见停留时间，按两次进入之间的实际时长累计）');
        lines.push('- 学习报告由本地进度生成，未提交任何个人数据');
        lines.push('');
        lines.push('## 模块明细');
        lines.push('');
        lines.push('| 模块 | 分类 | 状态 | 里程碑 | 测验 | 时长 | 最近学习 |');
        lines.push('|---|---|---|---|---|---|---|');
        rows.forEach(function (r) {
          lines.push('| ' + r.title + ' | ' + r.cat + ' | ' + r.status + ' | ' + r.steps + ' | ' + r.quiz + ' | ' + r.time + ' | ' + r.last + ' |');
        });
        lines.push('');
        var blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'learning-report-' + new Date().toISOString().slice(0, 10) + '.md';
        document.body.appendChild(a);

      /* ═════════ 单页壳：按需加载模块数据（modules/<key>.js）并渲染 ═════════ */
      var navView = document.getElementById('navView');

      var moduleRoot = document.getElementById('moduleRoot');
      var moduleTitle = document.getElementById('moduleTitle');

      /* ── 模块运行时资源回收 ──
       * 模块是追加进同一个文档的 <script>，它注册的定时器、rAF 链、
       * window/document 监听器在离开模块（moduleRoot 被清空）后依然活着：
       * 回调引用已删除的 DOM 就抛错（pid 的 300ms 自动运行、regex 的滚动 spy），
       * 多个模块的 keydown 监听还会同时响应同一组方向键。
       * 这里只在「模块脚本执行期间」以及「它自己排定的回调里」记账，
       * 壳层自身的计时不受影响；离开模块时统一回收。 */
      var modEpoch = 0;
      var curEpoch = null;
      var modTimers = [];

      function running(epoch, fn) {
        curEpoch = epoch;

      window.setTimeout = function (fn) {
        var args = Array.prototype.slice.call(arguments);
        if (curEpoch === null || typeof fn !== 'function') return nativeTimeout.apply(window, args);
        var epoch = curEpoch;
        args[0] = function () {
          var cbArgs = Array.prototype.slice.call(arguments);
          if (epoch !== modEpoch) return;          // 模块已被替换：旧回调作废
          running(epoch, function () { fn.apply(null, cbArgs); });
        };
        var id = nativeTimeout.apply(window, args);
        modTimers.push(id);
        return id;
      };
      window.setInterval = function (fn) {
        var args = Array.prototype.slice.call(arguments);
        if (curEpoch === null || typeof fn !== 'function') return nativeInterval.apply(window, args);

      /* 记账时就给回调包一层，事件触发时把 curEpoch 恢复回去。

       * 于是模块最常用的一条链漏了回收：

       *     clearTimeout(t); t = setTimeout(showNav, 60);   // 滚动里的 debounce
       *   });
       * scroll 回调执行时 curEpoch 是 null → 这个 setTimeout 走的是原生实现，
       * 既没进 modTimers（离开模块时不会被 clear），也没有 epoch 判活，
       * 于是切走之后它照样跑起来，对着已经 innerHTML='' 的 DOM 写 textContent：
       *   plc / n8n / gh-actions / redis 系（showNav 那一族）稳定抛
       *   TypeError: Cannot set properties of null (setting 'textContent')
       * 包一层之后，处理器内部再排的定时器会正常记账并随模块一起回收。
       * modWrap 同时记下「原函数 → 包装函数」，好让模块自己 removeEventListener(原函数)
       * 也能摘掉我们注册的包装（否则它会静默失配，监听器永远留在 window 上）。 */
      var modWrap = [];
      function trackListeners(target, nativeAdd, nativeRemove) {

       * 这些节点随模块一起消失，所以"摘不掉"不是问题；问题是**回调执行时 curEpoch 是
       * null**，于是回调里再排的一次 rAF / 定时器走原生实现——既不记账也不判活。
       * Round 20 的 pid 就是这么漏的（也是行为闸门在 81 条修完之后新抓到的第一条）：
       *   runBtn.addEventListener('click', resetAndRun)
       *     → step() 每帧 requestAnimationFrame(step)，整条链从来没被包装过
       *     → 离开模块，DOM 清空，链还在跑
       *     → computeMetrics() → setM() 对着已经不存在的 #mTr 取 .querySelector
       *       "Cannot read properties of null (reading 'querySelector')"
       * 判据只看 window/document 时会以为回收做完了——元素监听器是同一族，只是
       * 目标不在那两个对象上。把包装推到 EventTarget.prototype 上即可：只有
       * curEpoch 非空时的注册（=模块活着时注册的）被包，壳层自己的注册原样通过；
       * window / document 已经被上面的 own-property 版本接管，走的是 nativeAdd，
       * 不经过原型，所以不会被二次包装。 */
      var protoAdd = EventTarget.prototype.addEventListener;
      var protoRemove = EventTarget.prototype.removeEventListener;

        if (curEpoch === null || typeof handler !== 'function') return protoAdd.apply(this, arguments);
        var epoch = curEpoch, target = this;
        var wrapped = function (evt) {

      /* ═════════ 内联 on* 处理函数也要归进模块的 epoch ═════════
       * Round 20 的实测：全库遍历点击报 81 条未捕获 TypeError，而"只导航不点击"
       * 是 0 条——漏网的全是这条链：
       *   <button onclick="startScanSim()">        （plc:873）
       *     → startScanSim() 里 setInterval(runScanStep, 1200)   （plc:1448）
       *     → 切走模块，releaseModule 不认识这个 interval，它继续跑
       *     → 对着已经 innerHTML='' 的 DOM 写 textContent → 崩，
       *       而读者此刻在**下一个模块**里，看到的是"那个模块坏了"。
       * 为什么上一轮的 trackListeners 没堵上：浏览器执行内联 on* 属性时不经过
       * 任何我们注册的包装，curEpoch 是 null，于是 window.setInterval 走原生实现
       * ——既不记账，也没有 epoch 判活。同一个形态在 n8n（run 循环压到下一个
       * 模块头上）、vfd（setM → updateMetricsUI → computeMetrics → step）、
       * gh-actions 上都能复现。
       * 打包器把内联处理函数要用到的名字导回全局（`__g.startScanSim = startScanSim`），
       * 所以壳层能在脚本执行完之后按名字把它们包一层：包过之后处理器内部再排的
       * 定时器就正常进 modTimers，切走模块时被一起清掉。
       * 判活时**返回 undefined**而不是转发给原生函数：模块回收之后，任何一次
       * 迟到的内联点击（例如残留定时器程序化 el.click()）都不该再改 DOM——
       * 那正是本轮要消灭的现象。
       * 两条边界：`needsReady` 只是让壳层在脚本执行后补发一次 DOMContentLoaded，
       * 与内联属性无关，不需要特判；`el.onclick = fn` 这类属性赋值抓不到（值已经
       * 离开我们的视野），那种模块要靠自己别在 handler 里排跨生命周期的定时器。 */
      var inlineOwned = {};
      function ilWrapFn(orig, epoch) {
        var wrapped = function () {
          var a = Array.prototype.slice.call(arguments);
          if (epoch !== modEpoch) return undefined;
          var self = this;                    // running() 里的回调是裸调用，this 会在其中丢失
          return running(epoch, function () { return orig.apply(self, a); });
        };
        wrapped.__ilEpoch = epoch;
        wrapped.__ilInner = orig;
        return wrapped;
      }
      function guardInlineHandlers(epoch, names) {
        var g = typeof window !== 'undefined' ? window : globalThis;
        names.forEach(function (name) {
          var orig = g[name];
          /* 内联属性有两种写法：`onclick="startScanSim()"`（函数）和
             `onclick="DFL.run()"`（对象的方法）。实测 n8n / gh-actions / web 全用
             后者——只包函数会整批漏掉，所以对象要下去一层包方法。
             再深一层（对象里再套对象）实测没有：打包器只导出顶层声明的名字。 */
          if (typeof orig === 'function') {
            if (orig.__ilEpoch === epoch || (orig.__ilInner && inlineOwned[name] === orig.__ilInner)) return;

        if (!jsText) return [];

        while ((m = re.exec(jsText))) { if (!seen[m[1]]) { seen[m[1]] = 1; out.push(m[1]); } }

      }

      /* ═════════ 模块 CSS 隔离 ═════════
       * 模块的样式表以前是整份 append 到 <head> 的，于是它们里的全局选择器
       * 直接改写壳层。实测（45 个模块逐个访问并对比壳层计算样式）泄漏面：
       *   :root { --bg/--border/--text … }   44 处  → 壳层读同名变量，整站换肤
       *   body { padding-bottom:90px }       18 处  → 壳层底部出现空隙
       *   body { overflow / margin / max-width / font-size }  6 处
       *   .page { max-width:940px; margin:auto; padding }     git/bash → 模块视图被压窄
       *   html { scroll-behavior } / * { … } / [data-theme="dark"] .x
       * 模块 CSS 作者写这些选择器时，指的是"我自己这个页面"，因为源码确实是
       * 独立 HTML；打进壳层后 html/body 却是共享的。这里在注入前把选择器改写
       * 成以 #moduleRoot 为根，语义回到作者本意，壳层不再被穿透。
       *
       * 规则：
       *   :root / html / body        → #moduleRoot（保留其伪元素）
       *   *                          → #moduleRoot *
       *   [data-theme="X"]           → html[data-theme="X"] #moduleRoot
       *   [data-theme="X"] .foo      → html[data-theme="X"] #moduleRoot .foo
       *   其余 .foo / pre / #id      → #moduleRoot <原选择器>
       * 条件组（@media/@supports）递归处理，@keyframes 内部原样保留。 */
      var MR = '#moduleRoot';
      var DT_RE = /^\[\s*data-theme\s*=\s*(["'])([^"']*)\1\s*\]/;
      var GLOBAL_RE = /^(?:root|html|body)(?![\w-])/;   /* 已去掉前导 ':' */
      var LEAD_COMMENT = /^\s*\/\*[\s\S]*?\*\//;

      /* 摘掉前导注释：`.foo` 前那句 /* ── Card ── *\/ 若留在选择器里，
         就会挡住 :root / body 的识别，规则被拼成无效字符串直接失效
         （Round 17 给壳层规则加 #navView 前缀时正是栽在这里）。 */
      function splitLeadComments(s) {
        var lead = '', body = s, m;
        while ((m = LEAD_COMMENT.exec(body))) { lead += m[0]; body = body.slice(m[0].length); }
        return { lead: lead, body: body.trim() };
      }

      function scopeOne(part) {
        var s = part.trim();
        if (!s) return s;
        var dt = DT_RE.exec(s);
        if (dt) {
          var rest = s.slice(dt[0].length).trim();
          return 'html[data-theme="' + dt[2] + '"] ' + MR + (rest ? ' ' + rest : '');
        }
        /* :root / html / body → #moduleRoot。伪元素尾巴（body::before 的全屏
           背景层）一起搬过去，作者"给整页垫一层"的意思保持不变。 */
        if (GLOBAL_RE.test(s[0] === ':' ? s.slice(1) : s)) {
          var core = s[0] === ':' ? s.slice(1) : s;
          var hit = GLOBAL_RE.exec(core);
          return MR + core.slice(hit[0].length);

        return MR + ' ' + s;

      function scopeSelectorList(list) {
        var lead = splitLeadComments(list);
        var out = '', depth = 0, buf = '';
        var s = lead.body;
        for (var i = 0; i < s.length; i++) {
          var ch = s[i];
          if (ch === '(') depth++;
          else if (ch === ')') depth--;

      function skipString(css, i, q) {

          }
          if (c === '"' || c === "'") { var se = skipString(css, i, c); buf += css.slice(i, se + 1); i = se + 1; continue; }
          if (c === ';') { out += buf + ';'; buf = ''; i++; continue; }   /* @import / 声明串：原样 */
          if (c === '{') {

            var blk = readBlock(css, i);

              var nested = name === 'media' || name === 'supports' || name === 'layer' || name === 'container';
              out += pre.lead + pre.body + '{' + (nested ? scopeModuleCSS(blk[0]) : blk[0]) + '}';
            } else {
              out += pre.lead + scopeSelectorList(pre.body) + '{' + blk[0] + '}';
            }

          }
          buf += c; i++;
