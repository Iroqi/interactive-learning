        return out + buf;
      }

      function cleanupModule() {
        /* 计时以"模块容器被回收"为结算点：这里之后 moduleRoot 已经不再是
           读者看到的那个模块，再算下去就是把导航页的时间记到上一个模块头上。 */
        stopStudyTime();
        /* 离开前把本次会话新增的里程碑盖好时间戳——今日目标只认它。 */
        endStepSession();
        if (window.ILContrast) ILContrast.unwatch(moduleRoot);
        modEpoch++;               // 让任何仍在队列里的旧模块回调失效
        releaseModule();
        activeAssets.forEach(function (el) { if (el && el.parentNode) el.parentNode.removeChild(el); });
        activeAssets = [];
        moduleRoot.innerHTML = '';
        /* "当前模块"标记与容器同生同灭。留着它，模块的判活守卫就恒为真：
           n8n 的 run() 用 moduleRoot.dataset.mod === 'n8n' 判断读者还在不在，
           离开后 DOM 已清空、标记却没变，动画链条照跑，下一行就写空节点，
           在下一个屏幕上抛 TypeError（Round 22 行为闸门的"第二次进入"抓到的就是它）。 */
        delete moduleRoot.dataset.mod;
      }

      function injectModuleAssets(mod) {
        (mod.links || []).forEach(function (ln) {
          var href = (ln.match(/href="([^"]+)"/) || [])[1];
          if (!href) return;
          var el = document.createElement('link');
          el.rel = 'stylesheet';
          el.href = href;
          document.head.appendChild(el);
          activeAssets.push(el);
        });
        var st = document.createElement('style');
        st.setAttribute('data-il-module', '1');
        st.textContent = scopeModuleCSS(mod.css || '');
        /* 必须插在 courseSkin 之前：skin 的职责是"统一全部模块的视觉"，
           它靠 #moduleRoot 前缀取胜者通吃；模块样式若排在它后面，
           同特异度的规则会翻盘，统一外观就散了。 */
        var skin = document.getElementById('courseSkin');
        if (skin && skin.parentNode === document.head) document.head.insertBefore(st, skin);
        else document.head.appendChild(st);
        activeAssets.push(st);
      }

      function renderModule(key) {
        var mod = window.IL_MODULES && window.IL_MODULES[key];
        if (!mod) return;
        cleanupModule();
        /* 从模块真正渲染的这一刻开始计时；cleanupModule 刚把上一个模块结算掉。 */
        startStudyTime(key);
        var epoch = modEpoch;   // cleanupModule 刚递增过
        /* 访问时间戳由壳层统一记录：没有里程碑体系的早期模块（17 个）也能
           进入连续学习 / 热力图 / 到期复习，不必逐个改造模块内部代码。 */
        if (window.IL) IL.touch(key);
        /* 先记下进门时的 steps，模块脚本随后解锁的才算"今天新增"。 */
        beginStepSession(key);
        /* 把当前模块 key 挂到容器上：skin 里少数"只有某个模块这么写"的规则
           （plc 的 .simulator 深底、n8n 的翻转卡片…）可以精确点名，
           不必用一条通用规则去盖住其它模块的同名类。 */
        moduleRoot.dataset.mod = key;
        injectModuleAssets(mod);
        moduleRoot.innerHTML = mod.html || '';
        moduleTitle.textContent = mod.title || '';
        var js = document.createElement('script');
        js.textContent = mod.js || '';
        /* 脚本在 appendChild 时同步执行，模块的初始化（以及它注册的定时器与
           全局监听器）都发生在这段时间内；curEpoch 让资源回收能把它们归到本模块。 */
        running(epoch, function () {
          moduleRoot.appendChild(js);
          if (mod.needsReady) document.dispatchEvent(new Event('DOMContentLoaded'));
        });
        /* 脚本执行完之后，把内联 on* 处理函数包进本模块的 epoch（见上面那段） */
        guardInlineHandlers(epoch, inlineHandlerNames(mod.js));
        attachQuiz(key);
        /* 模块的 DOM 已全部就位（上面的 <script> 是同步执行的），从这里开始
           由 ILContrast 兜住写死颜色的前景色；之后的 DOM 变动由它的
           MutationObserver 续上。 */
        if (window.ILContrast) ILContrast.watch(moduleRoot);
        window.scrollTo(0, 0);
      }

      /* ── 统一测验层：为早期模块挂载共享测验引擎 ──
       * 17 个 Round 1 之前的存量模块各有各的 DOM 与配色，逐个改造测验代码
       * 风险高；这里按 key 查题库（ilquizzes.js），在模块末尾追加测验区块，
       * 用 ilquiz.js 的 IL.quiz 渲染，从而共享同一套 quiz.wrongs 协议与
       * 错题优先重做。已有自测题的模块跳过，避免重复出题。 */
      function attachQuiz(key) {
        if (!window.IL || !window.IL_QUIZZES || !window.IL_QUIZZES[key]) return;
        if (document.getElementById('ilQuizAppend')) return;
        var host = moduleRoot.querySelector('main') || moduleRoot.lastElementChild || moduleRoot;
        var sec = document.createElement('section');
        sec.className = 'il-quiz-append';
        sec.id = 'ilQuizAppend';
        sec.innerHTML =
          '<h2 class="il-quiz-h">掌握度测验</h2>' +
          '<p class="il-quiz-p">8 题 · 答完自动记录成绩与错题，错题本与“错题优先重做”随之生效。</p>' +
          '<div id="ilQuizBox"></div>';
        host.appendChild(sec);
        IL.quiz({ key: key, box: 'ilQuizBox', data: window.IL_QUIZZES[key], title: key });
      }

      function loadModule(key) {
        if (loadedModules[key]) { renderModule(key); return; }
        var s = document.createElement('script');
        s.src = 'modules/' + key + '.js';
        s.onload = function () { loadedModules[key] = true; renderModule(key); };
        s.onerror = function () { moduleTitle.textContent = '模块加载失败: ' + key; };
        document.head.appendChild(s);
      }

      function showNav() {
        cleanupModule();
        moduleView.hidden = true;
        navView.hidden = false;
        /* 返回导航页时刷新进度视图：模块内可能刚解锁里程碑或产生错题 */
        initProgress();
        sortCards();
      }

      function route() {
        var m = location.hash.match(/^#\/m\/([\w-]+)/);
        if (m && courses.some(function (c) { return c.key === m[1]; })) {
          navView.hidden = true;
          moduleView.hidden = false;
          loadModule(m[1]);
        } else {
          showNav();
        }
      }

      window.addEventListener('hashchange', route);

      /* 复习队列：提醒条是开关，面板内容由 initProgress 每次重画 */
      document.getElementById('reviewStrip').addEventListener('click', function () {
        setReviewOpen(!reviewOpen);
      });

      /* 备份恢复按钮 */
      document.getElementById('btnExport').addEventListener('click', exportBackup);
      /* 按钮上的清单从那张表拼出来，不手写：备份扩到第几个键，读者看到的说法就跟着走。
         手写这份文案的话，"少备一样"就会同时存在于代码和它自己的说明书里。 */
      document.getElementById('btnExport').title = '导出学习档案：' +
        IL_BACKUP_KEYS.map(function (b) { return b.label; }).join(' / ');
      document.getElementById('btnReport').addEventListener('click', exportReport);
      var importFile = document.getElementById('importFile');
      document.getElementById('btnImport').addEventListener('click', function () { importFile.click(); });
      importFile.addEventListener('change', function () {
        if (importFile.files && importFile.files[0]) importBackupFile(importFile.files[0]);
        importFile.value = '';
      });

      /* 重置全部进度（confirm 保护，清空后重载）
         清哪些、留哪些由 IL_BACKUP_KEYS 的 clearOnReset 决定，不再手写两个键：
         Round 26 之前它只清 il_progress / il_time，建站仿真进度、成就、今日目标
         都留在浏览器里——按钮说"清空全部学习进度"，实际留下半个档案。收藏与主题
         是偏好而不是进度，明确保留；两条清单都写进 confirm，读者点之前就知道。 */
      document.getElementById('btnReset').addEventListener('click', function () {
        var clear = [], keep = [];
        IL_BACKUP_KEYS.forEach(function (b) { (b.clearOnReset ? clear : keep).push(b); });
        var msg = '确定要清空全部学习进度吗？\n将清空：' +
          clear.map(function (b) { return b.label; }).join(' / ') +
          '\n保留：' + keep.map(function (b) { return b.label; }).join(' / ') +
          '\n此操作不可撤销，可先导出备份。';
        if (!window.confirm(msg)) return;
        try {
          clear.forEach(function (b) { localStorage.removeItem(b.key); });
          location.reload();
        } catch (e) { /* storage unavailable */ }
      });

      renderCards();
      sortCards();
      initProgress();
      route();
      /* 导航页也交给 watch()：筛选 pill 换 .active、搜索重画卡片、进度回填徽章
         都只是 class / 节点变动。原来这里只有启动时的一次 run()，读者点一下
         筛选就没有任何重算——被兜底钉住的旧颜色会跟着那个元素一路带进
         下一个状态。挂上 watch 之后属性变动与换肤后的 SETTLE 补算都会走。 */
      if (window.ILContrast && navView) ILContrast.watch(navView);
      refreshContrast();
    })();
  </script>
  <div class="toast-box" id="toastBox"></div>
</body>
</html>
