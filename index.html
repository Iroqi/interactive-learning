<!DOCTYPE html>
<!-- data-theme 的初值写在 HTML 上，并由壳层脚本在 <body> 解析之后才更新：
     壳层样式表里的 html[data-theme="light"] 在首屏就会命中，若让它先渲染成
     亮色、再用 JS 改回暗色，手机上会闪一下白屏（prefers-color-scheme: dark
     的用户每次进首页都白闪）。暗色是本站默认，所以静态值取 dark。 -->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交互式学习库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050507;
      --bg-card: #0d0d12;
      --bg-elevated: #131318;
      --text: #d6ffe0;
      --text-secondary: #9fcca9;
      --text-muted: #6d8a74;
      /* "淡一档"的字必须用颜色表达，不能用 opacity：opacity 会把文字和它所在
         的面板一起削薄，对比度算不准，触屏上也没有 hover 能把半透明解除。
         下面两个值按 WCAG 反推（暗 6.46:1 / 亮 4.62:1 对卡片底）。 */
      --text-faint: #7f9c86;
      --accent: #00ff41;
      --accent-dim: rgba(0, 255, 65, 0.12);
      --border: #1a2a20;
      --border-hover: #2a4a35;
      --devops: #00ff41;
      --cs: #00ff41;
      --automation: #00ff41;
      --tools: #00ff41;
      /* 强调色、语义色、面底色：暗色一套，亮色在下方覆盖。
         凡是"文字"用的颜色都必须是变量，不能写死霓虹绿——
         写死的颜色在亮色模式下无一例外会掉到 1.x:1。 */
      --badge-bg: rgba(0, 255, 65, 0.1);
      --focus: rgba(211, 168, 83, 0.4);
      --focus-ring: rgba(211, 168, 83, 0.06);
      --focus-strong: rgba(211, 168, 83, 0.5);
      --gold: #facc15;
      --gold-bg: rgba(211, 168, 83, 0.08);
      --panel-bg: rgba(20, 24, 34, 0.96);
      --bar-bg: rgba(12, 12, 14, 0.92);
      --panel-border: rgba(250, 204, 21, 0.45);
      --danger: #ef476f;
      --amber: #fbbf24;
      --teal: rgba(62, 206, 180, 0.65);
      --teal-bg: rgba(62, 206, 180, 0.09);
      --teal-border: rgba(62, 206, 180, 0.35);
      --hairline: #1a2a20;
      --hm-l1: #0e4429;
      --hm-l2: #006d32;
      --hm-l3: #26a641;
      --hm-l4: #39d353;
      --ambient-1: rgba(0, 255, 65, 0.05);
      --ambient-2: rgba(0, 255, 65, 0.04);
      --ambient-3: rgba(0, 255, 65, 0.03);
      --shadow: rgba(0, 0, 0, 0.35);
      --inset-line: rgba(255, 255, 255, 0.03);
      --selection: rgba(211, 168, 83, 0.25);
      --font-display: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Consolas, 'PingFang SC', 'Microsoft YaHei', monospace;
      --font-body: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace;
    }

    /* ── Light theme（il_theme=light / 系统亮色） ── */
    html[data-theme="light"] {
      --bg: #f5f6f8;
      --bg-card: #ffffff;
      --bg-elevated: #eef0f4;
      --text: #1b2230;
      --text-secondary: #5b6472;
      --text-faint: #626d7b;
      --border: #e2e6ec;
      --border-hover: #c9d0db;
      /* 类别色 / muted / 语义色 / 面底色在亮色下必须整套换掉：暗色那批值
         （霓虹绿 #00ff41、金 #facc15、青 rgba(62,206,180,…)）压白底全是 1.x–3.x:1。
         下面每个值都按 WCAG 反推，对所处面底 ≥4.5，由 tools/check-theme.js 把关。 */
      --devops: #0b6b39;
      --cs: #0b6b39;
      --automation: #0b6b39;
      --tools: #0b6b39;
      --accent: #0b6b39;
      --accent-dim: rgba(11, 107, 57, 0.10);
      --text-muted: #5c6674;
      --badge-bg: rgba(11, 107, 57, 0.12);
      --focus: #8a6100;
      --focus-ring: rgba(138, 97, 0, 0.15);
      --focus-strong: #6d4c00;
      --gold: #8a6100;
      --gold-bg: rgba(138, 97, 0, 0.08);
      --panel-bg: rgba(27, 34, 48, 0.96);
      --panel-border: rgba(138, 97, 0, 0.45);
      --panel-text: #ffe9a8;
      --bar-bg: rgba(255, 255, 255, 0.92);
      --danger: #be123c;
      --amber: #92620a;
      --teal: rgba(13, 110, 103, 0.85);
      --teal-bg: rgba(13, 110, 103, 0.08);
      --teal-border: rgba(13, 110, 103, 0.35);
      --hairline: #e2e6ec;
      --hm-l1: #9fd6b4;
      --hm-l2: #57b57e;
      --hm-l3: #1f8a4c;
      --hm-l4: #14532d;
      --ambient-1: rgba(11, 107, 57, 0.05);
      --ambient-2: rgba(11, 107, 57, 0.04);
      --ambient-3: rgba(11, 107, 57, 0.03);
      --shadow: rgba(15, 23, 42, 0.10);
      --inset-line: rgba(15, 23, 42, 0.05);
      --selection: rgba(11, 107, 57, 0.18);
    }
    html[data-theme="light"] body::before { opacity: 0.55; }
    #navView .card-star:hover { color: var(--gold); }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Atmospheric background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, var(--ambient-1), transparent),
        radial-gradient(ellipse 60% 40% at 80% 10%, var(--ambient-2), transparent),
        radial-gradient(ellipse 50% 60% at 50% 100%, var(--ambient-3), transparent);
      pointer-events: none;
      z-index: 0;
    }

    #navView.page { position: relative; z-index: 1; }

    /* ── Hero ── */
    #navView .hero {
      padding: 72px 40px 56px;
      text-align: center;
      position: relative;
    }

    #navView .theme-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s, transform 0.15s;
    }
    #navView .theme-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.06); }
    @media (max-width: 640px) { #navView .theme-btn { top: 16px; right: 16px; } }

    #navView .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.1s forwards;
    }

    #navView .hero-badge::before, #navView .hero-badge::after {
      content: '';
      width: 20px;
      height: 1px;
      background: var(--accent);
      opacity: 0.5;
    }

    #navView .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(40px, 6vw, 62px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 18px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.2s forwards;
    }

    #navView .hero h1 em {
      font-style: italic;
      color: var(--accent);
      font-weight: 600;
    }

    #navView .hero-sub {
      font-size: 17px;
      color: var(--text-secondary);
      max-width: 440px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.3s forwards;
    }

    /* ── Stats bar ── */
    #navView .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px 40px 0;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.4s forwards;
    }

    #navView .stat { text-align: center; }

    #navView .stat-num {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 600;
      color: var(--accent);
      display: block;
    }

    #navView .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    #navView .stat-divider {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }

    /* ── Thin accent line ── */
    .divider-line {
      height: 1px;
      margin: 32px auto 0;
      max-width: 720px;
      background: linear-gradient(90deg, transparent, var(--border), var(--accent-dim), var(--border), transparent);
    }

    /* ── Controls ── */
    #navView .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 28px 40px 20px;
      flex-wrap: wrap;
      max-width: 1100px;
      margin: 0 auto;
    }

    #navView .search-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
      max-width: 260px;
    }

    #navView .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    #navView .search-input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 12px;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    #navView .search-input::placeholder { color: var(--text-muted); }
    #navView .search-input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    #navView .sort-select {
      padding: 9px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.25s;
    }
    #navView .sort-select:hover { border-color: var(--border-hover); }
    #navView .sort-select:focus { border-color: var(--focus); }

    #navView .filters { display: flex; gap: 6px; flex-wrap: wrap; }

    #navView .pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-body);
      transition: all 0.25s;
      user-select: none;
    }

    #navView .pill:hover {
      border-color: var(--border-hover);
      background: var(--bg-elevated);
      color: var(--text);
    }

    #navView .pill.active {
      border-color: var(--focus-strong);
      background: var(--accent-dim);
      color: var(--accent);
    }

    #navView .pill .count {
      display: inline-block;
      margin-left: 3px;
      font-weight: 400;
      /* opacity: 0.6 把已经很小的 10px 数字再削一半（实测暗 4.48 / 亮 2.48:1）。
         触屏没有 hover，这个数字会永久停在半透明状态，所以数量差改用颜色表达。 */
      color: var(--text-faint);
      font-size: 10px;
    }

    /* ── Grid ── */
    #navView .grid-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 11px 40px 64px;
    }

    #navView .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 1000px) {
      #navView .grid { grid-template-columns: repeat(2, 1fr); }
      #navView .controls, #navView .grid-wrap { padding-left: 24px; padding-right: 24px; }
      #navView .hero { padding-left: 24px; padding-right: 24px; }
    }
    @media (max-width: 640px) {
      #navView .grid { grid-template-columns: 1fr; }
      #navView .controls, #navView .grid-wrap { padding-left: 16px; padding-right: 16px; }
      #navView .hero { padding-left: 16px; padding-right: 16px; }
      #navView .stats { gap: 24px; }
    }

    /* ── Card ── */
    #navView .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px 24px 24px;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(.2,.8,.2,1),
                  border-color 0.35s,
                  box-shadow 0.35s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeUp 0.55s ease forwards;
      overflow: hidden;
    }

    #navView .card::before {
      content: '';
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 2px;
      background: var(--cat-color);
      border-radius: 0 0 2px 2px;
      opacity: 0.5;
      transition: opacity 0.3s, left 0.35s, right 0.35s;
    }

    #navView .card:hover {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      box-shadow:
        0 11px 40px var(--shadow),
        0 0 0 1px var(--inset-line) inset;
    }

    #navView .card:hover::before {
      left: 0; right: 0;
      opacity: 0.8;
    }

    #navView .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    #navView .card-head-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #navView .card-star {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      /* 半透明星标在触屏上永远停在 0.5（没有 hover 可解除），实测 2.12:1。
         触屏适配段已经把命中区撑到 40px，这里把"未收藏"的视觉差交给颜色。 */
      color: var(--text-faint);
      padding: 0;
      transition: opacity 0.2s, color 0.2s, transform 0.15s;
      position: relative;
      z-index: 2;
    }
    #navView .card-star:hover { opacity: 1; color: var(--gold); transform: scale(1.18); }
    #navView .card-star.on { opacity: 1; color: var(--gold); }


    .toast-box {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--panel-text);
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 999px;
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      box-shadow: 0 10px 30px var(--shadow);
    }
    .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #navView .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 5px;
      line-height: 1.4;
    }

    #navView .card-idx {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      /* 原来是 --text-muted + opacity: 0.35：视觉上"淡"的效果由半透明做，
         实测暗色 1.61:1 / 亮色 1.65:1，手机上序号基本看不见。opacity 会同时
         削弱文字与其底色，任何对比度工具都算不出可靠结果（壳层的运行时兜底
         也刻意不看 opacity，见 ilcontrast.js），所以淡一档改用更暗的颜色值本身：
         --text-faint 在两套主题下都按 ≥4.5 反推。 */
      color: var(--text-faint);
      line-height: 1;
    }

    #navView .card h3 {
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    #navView .card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.65;
      flex: 1;
    }

    #navView .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    #navView .card-meta {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }

    /* 选中态的 pill 底色是 accent 的 10% 淡染，此时 --text-faint 压在淡染上
       只剩 4.20:1（<4.5），所以计数跟随 pill 本身的前景色。 */
    #navView .pill.active .count { color: var(--accent); }

    #navView .card-go {
      font-size: 11px;
      font-weight: 600;
      color: var(--cat-color, var(--accent));
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.3s, transform 0.3s;
    }

    #navView .card:hover .card-go {
      opacity: 1;
      transform: translateX(0);
    }

    #navView .card-go svg {
      width: 12px;
      height: 12px;
    }

    /* Category colors */
    #navView .card[data-cat="devops"]     { --cat-color: var(--devops); }
    #navView .card[data-cat="cs"]         { --cat-color: var(--cs); }
    #navView .card[data-cat="automation"] { --cat-color: var(--automation); }
    #navView .card[data-cat="tools"]      { --cat-color: var(--tools); }

    .badge[data-b="devops"]     { background: var(--badge-bg); color: var(--devops); }
    .badge[data-b="cs"]         { background: var(--badge-bg); color: var(--cs); }
    .badge[data-b="automation"] { background: var(--badge-bg); color: var(--automation); }
    .badge[data-b="tools"]      { background: var(--badge-bg); color: var(--tools); }

    /* ── Continue strip ── */
    .continue-strip {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      background: var(--accent-dim);
      border: 1px solid var(--focus);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.25s, transform 0.25s;
    }
    .continue-strip.show { display: flex; }
    .continue-strip:hover { border-color: var(--focus-strong); transform: translateY(-1px); }
    .continue-strip .cs-title { font-weight: 700; color: var(--accent); }
    .continue-strip .cs-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
    .continue-strip .cs-go {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; color: var(--accent); white-space: nowrap;
    }
    .continue-strip .cs-go svg { width: 12px; height: 12px; }
    .continue-wrap { padding: 6px 40px 0; }
    @media (max-width: 1000px) { .continue-wrap { padding-left: 24px; padding-right: 24px; } }
    @media (max-width: 640px) { .continue-wrap { padding-left: 16px; padding-right: 16px; } }

    /* ── Review queue (spaced repetition) ──
       一条提醒在 Round 25 变成一张队列表：提醒条只报摘要，展开后每行一个到期
       模块，行内写明它为什么在这个间隔上、逾期几天。间隔是纯函数（见
       REVIEW_SPACING），不新增存储字段；判据见 tools/check-behavior.js。 */
    .review-wrap { padding: 6px 40px 0; }
    .review-strip {
      display: flex; width: 100%;
      max-width: 1100px; margin: 0 auto;
      padding: 14px 20px;
      background: var(--teal-bg);
      border: 1px solid var(--teal-border);
      border-radius: 12px;
      font: inherit; font-size: 13px; color: var(--text);
      text-align: left; cursor: pointer;
      align-items: center; justify-content: space-between; gap: 12px;
      transition: border-color 0.25s, transform 0.25s;
    }
    .review-strip:hover { border-color: var(--teal); transform: translateY(-1px); }
    .review-strip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .review-strip .rs-title { font-weight: 700; color: var(--devops); }
    .review-strip .rs-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
    .review-strip .rs-go {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; color: var(--devops); white-space: nowrap;
    }
    .review-strip .rs-caret { width: 12px; height: 12px; transition: transform 0.2s; }
    .review-strip[aria-expanded="true"] .rs-caret { transform: rotate(180deg); }
    .review-panel {
      display: none; max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden;
    }
    .review-panel.show { display: block; }
    .review-panel .rp-note {
      padding: 10px 16px; font-size: 11px; color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    #navView .rp-item {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px;
      padding: 11px 16px; min-height: 48px; align-items: center;
      color: var(--text); text-decoration: none;
      border-bottom: 1px solid var(--border); transition: background 0.2s;
    }
    #navView .rp-item:last-child { border-bottom: none; }
    #navView .rp-item:hover, #navView .rp-item:focus-visible { background: var(--bg-elevated); }
    #navView .rp-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    .rp-item .rp-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .rp-item .rp-title { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rp-item .rp-main .badge { flex: none; }
    .rp-item .rp-meta {
      grid-column: 1; font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rp-item .rp-due {
      grid-column: 2; grid-row: 1 / span 2; align-self: center;
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      color: var(--amber); white-space: nowrap;
    }
    .rp-item.ahead .rp-due { color: var(--text-secondary); font-weight: 600; }
    @media (max-width: 1000px) { .review-wrap { padding-left: 24px; padding-right: 24px; } }
    @media (max-width: 640px) { .review-wrap { padding-left: 16px; padding-right: 16px; } }

    /* ── Card progress ── */
    #navView .card-progress { margin-top: 12px; }
    #navView .card-progress .cp-track {
      display: block; height: 4px; border-radius: 999px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      overflow: hidden; margin-bottom: 5px;
    }
    #navView .card-progress .cp-fill {
      display: block; height: 100%; width: 0;
      background: var(--accent);
      border-radius: 999px; transition: width 0.5s ease;
    }
    #navView .card-progress .cp-label {
      font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    #navView .card-progress .cp-label.cp-done { color: var(--cat-color, var(--accent)); font-weight: 600; }

    /* ── Progress overview ── */
    .overview-wrap { padding: 6px 40px 0; }
    .overview {
      display: none;
      max-width: 1100px; margin: 0 auto;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px;
      align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    }
    .overview.show { display: flex; }
    .overview .ov-title {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted);
    }
    .overview .ov-stats { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
    .overview .ov-item { font-size: 12px; color: var(--text-secondary); }
    .overview .ov-item b { font-family: var(--font-mono); font-size: 15px; margin-right: 4px; }
    .overview .ov-item.ov-done b { color: var(--devops); }
    .overview .ov-item.ov-going b { color: var(--accent); }
    .overview .ov-item.ov-todo b { color: var(--text-muted); }
    .overview .ov-item.ov-streak b { color: var(--devops); }
    .overview .ov-item.ov-time b { color: var(--amber); }
    .overview .ov-milestones { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .overview .ov-actions { display: flex; gap: 8px; align-items: center; }
    /* 选择器原本是 `.overview .ov-btn`，但「今日目标」那一行是 .ov-goal（.overview 的兄弟），
     * 于是它的「设定 / 修改」按钮从来没被样式命中过，直接渲染成浏览器原生按钮。
     * 收到 #navView 下既修了这个，也保住命名空间不外泄到模块。 */
    #navView .ov-btn {
      font-family: var(--font-body); font-size: 11px; font-weight: 600;
      padding: 6px 12px; border-radius: 8px; cursor: pointer;
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text-secondary); transition: all 0.2s;
    }
    #navView .ov-btn:hover { border-color: var(--accent); color: var(--accent); }
    .overview .ov-import-note { font-size: 10px; color: var(--text-muted); }
    #navView .ov-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Category dashboard ── */
    .ov-cats {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px;
    }
    .ov-cats.show { display: block; }
    .ov-cats-title {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }
    .ov-cat { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
    .ov-cat:last-child { margin-bottom: 0; }
    .ov-cat-name {
      width: 76px; flex: none; text-align: right;
      font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: var(--text-secondary);
    }
    .ov-cat-bar { flex: 1; height: 8px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .ov-cat-fill { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 0.5s ease; }
    .ov-cat-num { width: 120px; flex: none; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    @media (max-width: 1000px) { .ov-cats { margin-left: 24px; margin-right: 24px; } }
    @media (max-width: 640px) { .ov-cats { margin-left: 16px; margin-right: 16px; } }

    /* ── Daily goal ── */
    .ov-goal {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 20px; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .ov-goal.show { display: flex; }
    .og-label {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted);
    }
    .og-input {
      width: 150px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: var(--font-mono); font-size: 12px; padding: 6px 10px; outline: none;
    }
    .og-input:focus { border-color: var(--focus); }
    .og-note { font-size: 10px; color: var(--text-muted); }
    .og-bar { flex: 1; min-width: 160px; height: 8px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .og-fill { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.5s ease; }
    .og-num { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }
    .og-num.og-done { color: var(--devops); font-weight: 700; }
    @media (max-width: 1000px) { .ov-goal { margin-left: 24px; margin-right: 24px; } }
    @media (max-width: 640px) { .ov-goal { margin-left: 16px; margin-right: 16px; } }

    /* ── Badges ── */
    .ov-badges {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px;
    }
    .ov-badges.show { display: block; }
    .ov-badges-title {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }
    .ov-badges-title .b-count { color: var(--accent); letter-spacing: 0; }
    .ov-badges-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge-chip {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; padding: 7px 13px; border-radius: 999px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text-secondary); cursor: default;
      transition: border-color 0.2s, opacity 0.2s;
    }
    .badge-chip .b-ico { font-size: 14px; line-height: 1; }
    /* 未解锁徽章：以前是 opacity: 0.38 + grayscale，实测压在产品底色上只有
       1.69:1（亮）/2.49:1（暗），字基本看不见。灰度保留（它只动图标颜色），
       "淡"改由 --text-faint 承担，两套主题都在 4.5 以上。 */
    .badge-chip.locked { filter: grayscale(0.7); color: var(--text-faint); border-color: var(--border); }
    .badge-chip.unlocked {
      border-color: var(--focus-strong); background: var(--gold-bg);
      color: var(--text);
    }
    .badge-chip:hover { border-color: var(--border-hover); }
    .badge-chip.unlocked:hover { border-color: var(--accent); }
    @media (max-width: 1000px) { .ov-badges { margin-left: 24px; margin-right: 24px; } }
    @media (max-width: 640px) { .ov-badges { margin-left: 16px; margin-right: 16px; } }
    @media (max-width: 1000px) { .overview-wrap { padding-left: 24px; padding-right: 24px; } }
    @media (max-width: 640px) { .overview-wrap { padding-left: 16px; padding-right: 16px; } }

    /* ── Learning heatmap（近 90 天） ── */
    .ov-heat {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px;
    }
    .ov-heat.show { display: block; }
    .ov-heat-title {
      display: flex; align-items: baseline; gap: 12px;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }
    .ov-heat-title .hm-meta { font-size: 10px; letter-spacing: 0; color: var(--text-secondary); font-family: var(--font-mono); }
    .hm-grid { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
    .hm-col { display: flex; flex-direction: column; gap: 3px; }
    .hm-cell { width: 11px; height: 11px; border-radius: 3px; background: var(--bg-elevated); border: 1px solid var(--border); }
    .hm-cell.l1 { background: var(--hm-l1); border-color: var(--hm-l1); }
    .hm-cell.l2 { background: var(--hm-l2); border-color: var(--hm-l2); }
    .hm-cell.l3 { background: var(--hm-l3); border-color: var(--hm-l3); }
    .hm-cell.l4 { background: var(--hm-l4); border-color: var(--hm-l4); }
    .hm-legend { display: flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
    .hm-legend .hm-cell { border: none; }
    @media (max-width: 1000px) { .ov-heat { margin-left: 24px; margin-right: 24px; } }
    @media (max-width: 640px) { .ov-heat { margin-left: 16px; margin-right: 16px; } }

    /* ── Quiz trend ── */
    .ov-quiz {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px;
    }
    .ov-quiz.show { display: block; }
    .ov-quiz-title {
      display: flex; align-items: baseline; gap: 12px;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }
    .ov-quiz-title .qm-meta { font-size: 10px; letter-spacing: 0; color: var(--text-secondary); font-family: var(--font-mono); }
    .qz-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .qz-name { width: 170px; flex: none; text-align: right; font-size: 11px; font-weight: 600; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qz-bar { flex: 1; height: 8px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .qz-fill { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.5s ease; }
    .qz-num { width: 64px; flex: none; font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .qz-avg { margin-top: 4px; font-size: 11px; color: var(--devops); font-family: var(--font-mono); }
    @media (max-width: 1000px) { .ov-quiz { margin-left: 24px; margin-right: 24px; } }
    @media (max-width: 640px) { .ov-quiz { margin-left: 16px; margin-right: 16px; } }

    /* ── Wrong-book ── */
    .ov-wrong {
      display: none;
      max-width: 1100px; margin: 8px auto 0;
      background: var(--bg-card); border: 1px solid var(--hairline); border-radius: 6px;
      padding: 14px 20px;
    }
    .ov-wrong.show { display: block; }
    .ov-wrong-title {
      display: flex; align-items: baseline; gap: 12px;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }
    .ov-wrong-title .wm-meta { font-size: 10px; letter-spacing: 0; color: var(--text-secondary); font-family: var(--font-mono); }
    .ow-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
    .ow-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      background: var(--bg-elevated); border: 1px solid var(--hairline); border-radius: 6px;
      color: var(--text-secondary); font-size: 12px; cursor: pointer; text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    .ow-item:hover { border-color: var(--accent); color: var(--accent); }
    .ow-item b { font-family: var(--font-mono); color: var(--amber); font-size: 13px; margin-right: 2px; }
    .ow-item .ow-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ow-item .ow-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; }
    .ow-empty { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }

    /* Hidden card animation */
    #navView .card.filtered-out {
      opacity: 0 !important;
      transform: scale(0.96) !important;
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }

    /* ── Empty state ── */
    #navView .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 72px 20px;
      color: var(--text-muted);
    }

    #navView .empty-icon {
      font-size: 40px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    #navView .empty-text {
      font-size: 14px;
      color: var(--text-secondary);
    }

    #navView .empty-suggest {
      margin-top: 16px;
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 7px 14px;
      cursor: pointer;
    }

    #navView .empty-suggest:hover { background: var(--badge-bg); }

    #navView .empty-note {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }


    /* ── Module view (shell) ── */
    .module-view { padding: 0; }
    .module-bar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 14px;
      max-width: 1180px; margin: 0 auto; padding: 14px 40px;
      background: var(--bar-bg); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .module-bar a.module-back {
      font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none; white-space: nowrap;
      border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px;
      transition: color 0.2s, border-color 0.2s;
    }
    .module-bar a.module-back:hover { color: var(--accent); border-color: var(--accent); }
    .module-bar .module-title {
      font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    @media (max-width: 1000px) { .module-bar { padding-left: 24px; padding-right: 24px; } }
    @media (max-width: 640px) { .module-bar { padding-left: 16px; padding-right: 16px; } }

    /* ── 壳层挂载的共享测验区块（早期模块）──
       模块各自的 CSS 不认识这些类名，配色沿用 geek 终端皮肤变量。 */
    .il-quiz-append {
      display: block; margin: 8px auto 40px; padding: 22px 20px 8px;
      max-width: 900px; border: 1px dashed var(--border); border-radius: 8px;
    }
    .il-quiz-append h2.il-quiz-h {
      font-family: var(--font-mono); font-size: 17px; letter-spacing: 1px;
      color: var(--accent); margin: 0 0 8px; text-transform: none;
    }
    .il-quiz-append p.il-quiz-p { font-size: 13px; color: var(--text-muted); margin: 0 0 18px; }

    /* ── Footer ── */
    #navView .foot {
      text-align: center;
      padding: 20px 40px 56px;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 7px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── 触屏适配（只在 pointer: coarse 的设备上生效，桌面版式一字不改）──
     * 三件事，都是"看起来正常、实际按不到/看不清"：
     * 1) 星标只有 17×17，而它就压在可点击的卡片上——手指根本点不准，
     *    点歪了就变成打开卡片。用负 margin 把命中区撑到 40px 但不动视觉位置。
     * 2) pill / 按钮 / 输入框普遍 23~28px 高，低于拇指可点下限。
     * 3) iOS Safari 在聚焦 font-size < 16px 的输入框时会自动放大整页，
     *    放大后不会自动缩回，搜索时屏幕就废了——所以触屏下把输入字号提到 16px。 */
    @media (pointer: coarse) {
      #navView .card-star {
        width: 40px; height: 40px;
        margin: -12px -12px -12px 0;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 17px;
      }
      #navView .pill { min-height: 40px; padding: 9px 16px; }
      /* 「开始学习 →」原来是 opacity:0 + hover 才显形。触屏没有 hover，
         这行字在手机上是永久不可见的（不是对比度问题，是根本没有像素）。
         触屏下直接常显，位置也复位。 */
      #navView .card-go { opacity: 1; transform: none; }
      #navView .search-input { height: 44px; font-size: 16px; }
      #navView .sort-select { min-height: 40px; font-size: 16px; }
      #navView .ov-btn { min-height: 40px; padding: 10px 16px; font-size: 13px; }
      .og-input { min-height: 40px; font-size: 16px; }
      .empty-suggest { min-height: 44px; font-size: 14px; }
      .module-bar .nav-btn { min-height: 40px; }
      #navView .theme-btn { width: 44px; height: 44px; }
    }
    /* ── Selection ── */
    ::selection { background: var(--selection); }
  </style>
</head>
<body>
  <div class="page" id="navView">

    <!-- ── Hero ── -->
    <header class="hero">
      <button type="button" id="btnTheme" class="theme-btn" title="主题：自动跟随系统">◐</button>
      <div class="hero-badge">Interactive Learning</div>
      <h1>交互式<em>学习</em>库</h1>
      <p class="hero-sub">精心打造的互动学习体验，涵盖 DevOps、计算机科学、工业自动化与开发工具</p>
    </header>

    <!-- ── Controls ── -->
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="10" cy="10" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search" class="search-input" placeholder="搜索课程..." autocomplete="off">
      </div>
      <div class="filters" id="filters">
        <button class="pill active" data-cat="all">全部 <span class="count">15</span></button>
        <button class="pill" data-cat="devops">DevOps <span class="count">4</span></button>

  <!-- ── FreeCodeCamp-style course skin（置于模块样式之后，统一全部模块视觉） ── -->
  <style id="courseSkin">
  /* skin token：暗色为默认值，亮色在下方 html[data-theme="light"] 覆盖。
     模块自身的 CSS 用 [data-theme="dark"] 选择器（壳层的 html 属性），
     所以只要 skin 也跟着主题走，模块就能自然分亮/暗两套。 */
  #moduleRoot {
      --sk-page: #050507; --sk-card: #0d0d12; --sk-head: #0d0d10; --sk-elev: #131318;
      --sk-border: #1a2a20; --sk-hover: #243a2c;
      --sk-text: #d6ffe0; --sk-dim: #9fcca9; --sk-body: #c2d9c8;
      --sk-muted: #6d8a74; --sk-faint: #6d8a74; --sk-comment: #8a8aa0;
      --sk-accent: #00ff41; --sk-accent-hi: #00d43a; --sk-code: #7dffa0;
      --sk-success: #4ade80; --sk-err: #d24d4d; --sk-ok: #e6ffe9; --sk-err-fg: #f8d7d7;
      --sk-on-accent: #050507;
      /* 代码面板专用一对：这类区块在模块源码里几乎都写死"深底浅字"
         （docker 的 .explorer-code/.code-line/.console-output、net 的终端…），
         亮色下若仍给深底就会和 skin 的白底页面打架（白字压白底 / 深字压深底）。
         所以单独给一组 token：暗色=近黑底+浅字，亮色=浅灰底+深字。 */
      --sk-code-bg: #0a0a0f; --sk-code-fg: #d6ffe0; --sk-code-bar: #131318; --sk-code-dim: #9fcca9;
      --sk-warn-fg: #fbbf24; --sk-info-fg: #93c5fd; --sk-danger-fg: #f87171;
      --sk-tint-08: rgba(0, 255, 65, 0.08); --sk-tint-12: rgba(0, 255, 65, 0.12);
      --sk-tint-14: rgba(0, 255, 65, 0.14); --sk-tint-25: rgba(0, 255, 65, 0.25);
      --sk-tint-35: rgba(0, 255, 65, 0.35); --sk-tint-40: rgba(0, 255, 65, 0.4);
      --sk-tint-50: rgba(0, 255, 65, 0.5);  --sk-err-tint: rgba(210, 77, 77, 0.12);
      --sk-nav-bg: rgba(5, 5, 7, 0.94);
    }

  /* 亮色：模块默认 CSS 是亮色（45 个模块里 41 个的 :root 就是浅色值），
     skin 若把面底写死成暗色，就出现 rgb(71,85,105) 文字压 rgb(13,13,18) = 2.5:1。
     下面每个值按 WCAG 反推，对所处面底 ≥4.5（tools/check-theme.js 把关）。
     必须挂在 html[data-theme="light"] 上：写成 `html[...] #moduleRoot` 会与
     模块自己的裸 [data-theme="dark"] 选择器抢 <html> 属性，谁在后谁赢。 */
  html[data-theme="light"] #moduleRoot {
      --sk-page: #ffffff; --sk-card: #f7f8fa; --sk-head: #eef0f4; --sk-elev: #e6eaf0;
      --sk-border: #dfe4ea; --sk-hover: #dbe6de;
      --sk-text: #101725; --sk-dim: #41505f; --sk-body: #232c39;
      --sk-muted: #5c6674; --sk-faint: #5c6674; --sk-comment: #55606f;
      --sk-accent: #0b6b39; --sk-accent-hi: #085c2f; --sk-code: #065f32;
      --sk-success: #126e34; --sk-err: #b91c1c; --sk-ok: #14532d; --sk-err-fg: #7f1d1d;
      --sk-on-accent: #ffffff;
      --sk-code-bg: #101725; --sk-code-fg: #e6edf6; --sk-code-bar: #1b2230; --sk-code-dim: #b5c1d1;
      --sk-warn-fg: #8a5a00; --sk-info-fg: #1d4ed8; --sk-danger-fg: #b91c1c;
      --sk-tint-08: rgba(11, 107, 57, 0.08); --sk-tint-12: rgba(11, 107, 57, 0.12);
      --sk-tint-14: rgba(11, 107, 57, 0.14); --sk-tint-25: rgba(11, 107, 57, 0.25);
      --sk-tint-35: rgba(11, 107, 57, 0.35); --sk-tint-40: rgba(11, 107, 57, 0.40);
      --sk-tint-50: rgba(11, 107, 57, 0.50); --sk-err-tint: rgba(185, 28, 28, 0.10);
      --sk-nav-bg: rgba(255, 255, 255, 0.94);
    }

  /* 模块内部那批变量名（--bg / --surface / --primary …）由各模块自己发明，
     skin 统一它们：一律指向上面的 --sk-* token，于是改主题只改 token。
     选择器要带上 html[data-theme=…] 形态：CSS 隔离后模块自己的
     [data-theme="dark"]{--bg:#0f172a…} 被改写成 html[data-theme="dark"] #moduleRoot
     （特异度 1,1,1），裸 #moduleRoot（1,0,0）抢不过它，暗色下这些模块会退回
     自己的石板蓝配色。补齐同等特异度 + skin 表在后，主题切换才真正由 token 决定。 */
  #moduleRoot,
  html[data-theme="dark"] #moduleRoot,
  html[data-theme="light"] #moduleRoot {
      --bg: var(--sk-page); --card: var(--sk-card); --raise: var(--sk-elev);
      --border: var(--sk-border); --line: var(--sk-border);
      --text: var(--sk-text); --dim: var(--sk-dim); --muted: var(--sk-muted);
      /* 这三个名字使用量最大（--text-muted 145 处、--text-dim 18 处、
         --text-secondary 也在用），漏掉它们等于让 24 个模块继续用自己
         :root 里的石板灰（#64748b/#6b7280 压在暗底上只有 3.4~4.3:1）。 */
      --text-muted: var(--sk-muted); --text-dim: var(--sk-muted);
      --text-secondary: var(--sk-dim); --text-body: var(--sk-body);
      --bg2: var(--sk-card); --bg3: var(--sk-elev); --surface: var(--sk-card);
      --surface-alt: var(--sk-head); --surface2: var(--sk-elev); --surface3: var(--sk-hover);
      --bg-secondary: var(--sk-head); --surface-hover: var(--sk-hover);
      --card-2: var(--sk-elev); --card-light: var(--sk-elev); --bg-warm: var(--sk-page);
      --accent: var(--sk-accent); --accent2: var(--sk-code); --primary: var(--sk-accent);
      --primary-light: var(--sk-code); --primary-dark: var(--sk-accent-hi);
      --primary-bg: var(--sk-tint-12);
      --indigo: var(--sk-accent); --indigo-light: var(--sk-code); --brand: var(--sk-accent);
      --success: var(--sk-success); --green: var(--sk-success);
      /* --error/--info 也是模块自造的状态色（docker/gh-actions/net 等 19 个
         模块在用）。不映射的话切到亮色仍是 #ef4444/#3b82f6，压在浅面上
         分别只有 3.3/3.1:1——本轮就是被 tools/check-theme.js 抓出来的。 */
      --error: var(--sk-err); --danger: var(--sk-err);
      --info: var(--sk-info-fg); --warning: var(--sk-warn-fg);
      /* --warn 是 --warning 的短名（n8n 用 8 处，且全是"红色错误"语义：
         .quiz-option.wrong / .expr-result.error / .br-item.routed-false），
         跟 danger 走同一个 token；pid/vscode 只定义不使用，不受影响。 */
      --warn: var(--sk-danger-fg);
      --k8s: var(--sk-accent); --redis: var(--sk-accent); --prompt: var(--sk-accent);
      --tf: var(--sk-accent); --nginx: var(--sk-accent); --netsec: var(--sk-accent);
      --async: var(--sk-accent); --ts: var(--sk-accent); --perm: var(--sk-accent);
      --compose: var(--sk-accent); --algo: var(--sk-accent); --tx: var(--sk-accent);
      --sd: var(--sk-accent); --css: var(--sk-accent); --sqlidx: var(--sk-accent);
      --rust: var(--sk-accent); --helm: var(--sk-accent); --prom: var(--sk-accent);
      --jwt: var(--sk-accent);
      /* 第二批模块自造变量（本轮由"关掉兜底"的源头审计 r17cluster.js 量化出来）：
         --text2 用 48 处（sql 的表格正文就是它，白底上 2.52:1）、--ok/--bad/--err
         是 --success/--error 的短名、--ink* 是 cs/vscode 那套中性墨色、
         --code-bg/--code-text 是"代码面板"专用一对（恒定深色，不随主题翻转）。
         一起收进 token，模块就不用各自维护第二套配色。 */
      --text2: var(--sk-dim); --text-2: var(--sk-dim);
      --ok: var(--sk-success); --bad: var(--sk-err); --err: var(--sk-err);
      --ink: var(--sk-text); --ink-2: var(--sk-dim); --ink-3: var(--sk-muted);
      --code-bg: var(--sk-code-bg); --code-text: var(--sk-code-fg);
      --output: var(--sk-code); --surface-2: var(--sk-elev);
      --success-bg: var(--sk-tint-12); --error-bg: var(--sk-err-tint);
      --accent-bg: var(--sk-tint-12); --error-light: var(--sk-err);
      --success-light: var(--sk-success); --primary-dim: var(--sk-dim);
      --border-strong: var(--sk-border);
      --purple: var(--sk-accent); --red: var(--sk-err);
      /* --git / --http 这类"品牌色"绝不映射：模块把白字画在它们上面是成对的
         （GitHub 红 #f05133、HTTP 青 #2dd4bf 配白字），一旦映射成 --sk-accent
         就变成亮色墨绿 #0b6b39 配白字 = 1.03:1，标签整个消失。品牌色保持
         各模块自己的常量值，standalone 与壳层一致。 */
      --http: var(--sk-code); --logic: var(--sk-warn-fg);
      --i-color: var(--sk-success); --d-color: var(--sk-info-fg); --p-color: var(--sk-warn-fg);
    }


  
    /* 这套 skin 原本直接写死暗色 + !important，并且重定义了 :root 变量，
       于是壳层的 html[data-theme="light"] 全部被覆盖——亮色模式下白底配
       近白文字（.overview / .badge / 卡片分类标签）整片不可读。
       它的职责只是"统一全部模块的视觉"，所以整体收进 #moduleRoot：
       模块照旧统一，壳层交还给主题变量。 */

  
  #moduleRoot { background: var(--sk-page) !important; color: var(--sk-text); }
  #moduleRoot .mast,
  #moduleRoot .hero,
  #moduleRoot .container { max-width: 860px; }
  #moduleRoot h1,
  #moduleRoot h2,
  #moduleRoot h3,
  #moduleRoot .hero h1,
  #moduleRoot .hero-title,
  #moduleRoot .sec-title,
  #moduleRoot .section-title,
  #moduleRoot .level-header,
  #moduleRoot .step-header,
  #moduleRoot .level-title {
      color: var(--sk-text) !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif !important;
    }
  #moduleRoot .subtitle,
  #moduleRoot .mast-count,
  #moduleRoot .progress-meta,
  #moduleRoot .lead,
  #moduleRoot .hero-sub,
  #moduleRoot .level-meta,
  #moduleRoot .step-desc,
  #moduleRoot .sec-desc,
  #moduleRoot .section-desc,
  #moduleRoot .card-desc {
      color: var(--sk-dim) !important;
    }
  /* .badge 一类的"小胶囊"：skin 把底色统一成 accent，但文字色仍来自模块
     （常见 `color: var(--accent)`）——于是霓虹绿字压霓虹绿底，实测 1.00:1，
     标签整块消失（light 17 处 + dark 21 处）。底色与前景必须成对声明。 */
  #moduleRoot .mast .badge,
  #moduleRoot .badge { background: var(--sk-accent) !important; color: var(--sk-on-accent) !important; }
  #moduleRoot .badge.badge-cognition,
  #moduleRoot .badge.badge-guided,
  #moduleRoot .badge.badge-independent,
  #moduleRoot .badge.badge-challenge { background: var(--sk-tint-14) !important; color: var(--sk-text) !important; }
  /* 序号：pid/bash/git 的 `h2 .num` 自带实心底色，前景必须在模块源码里成对
     声明并带 !important——壳层这条通用规则（`#moduleRoot .num`，特异度 1,1,0 +
     !important）会盖掉模块里不带 !important 的字色，变成"绿字压绿底"1.00:1。
     其余 16 个模块的 `.step h2 .num` 只是描边数字、没有底色，归这条规则管。
     注意别再往壳层加 `#moduleRoot h2 .num{color:var(--sk-on-accent)}`：它对那
     16 个描边数字同样成立，把字刷成白色压在卡片浅底上，实测 289 处 1.00:1，
     比原问题更大。配对只做在模块侧。 */
  #moduleRoot .num,
  #moduleRoot .step-tag,
  #moduleRoot .q-num,
  #moduleRoot .level-num { color: var(--sk-accent) !important; border-color: var(--sk-accent) !important; }
  #moduleRoot .progress-track,
  #moduleRoot .progress-bar,
  #moduleRoot .progress-strip,
  #moduleRoot .progress-bar-wrap { background: var(--sk-elev) !important; }
  #moduleRoot .progress-fill { background: var(--sk-accent) !important; }
  #moduleRoot .progress-strip .fill,
  #moduleRoot .progress-strip .prog > i,
  #moduleRoot .progress-strip .bar > i { background: var(--sk-accent) !important; }
  /* 以前这里是 `.progress-strip span { background: accent !important }`，本意是给
     进度条的填充块上色，但 regex/sql 的进度条写成
     `<div class="prog"><i></i></div><span class="plabel">0 / 9 里程碑</span>`——
     span 是**文字标签**，被涂成实心 accent 底后，模块给它的是 var(--dim) 深字，
     实测 1.25:1（暗色 1.32:1），里程碑计数完全看不见。改成只打真正填充块
     （.fill / .prog>i / .bar>i），文字标签交还给主题。 */
  #moduleRoot .progress-strip .plabel { color: var(--sk-dim); }
  /* 代码/终端类容器：亮色主题下也保持"恒定的深色面板"。
     这些区块在 45 个模块里普遍是"深底 + 浅色等宽字"（模块写死 #0d1117 一类），
     以前 skin 把它们刷成页面底色（亮色=白），结果模块的浅灰语法字压白底只有
     1.2~2.8:1，一整批 inline 语法 span（.kw/.str/.fn/.num…）全靠运行时兜底改色。
     改成恒定的 --sk-code-bg/--sk-code-fg：面板深浅不随主题翻转，模块自己的
     深色语法色板（JetBrains/Tomorrow 那一套浅色字）天然成立。文档站常见做法。
     注意 .lab / .lab-body / md 面板不在这里——它们是"内容面板"，模块在里面
     用的是 var(--text) 系，跟着主题走才对。 */
  #moduleRoot pre,
  #moduleRoot .code-block,
  #moduleRoot .code-area,
  #moduleRoot .code-editor,
  #moduleRoot .expr-input,
  #moduleRoot .expr-input-area,
  #moduleRoot .sandbox-editor,
  #moduleRoot .editor-area,
  #moduleRoot .console {
      background: var(--sk-code-bg) !important; border-color: var(--sk-code-bar) !important; color: var(--sk-code-fg) !important;
    }
  /* 行内 code 芯片见下方 .lead code 那一组（面板内的芯片要跟面板同系）。 */
  #moduleRoot .lab,
  #moduleRoot .lab-body,
  #moduleRoot .md-editor-pane,
  #moduleRoot .md-preview-pane {
      background: var(--sk-page) !important; border-color: var(--sk-border) !important; color: var(--sk-body);
    }

  /* ── 深色孤岛必须整套换掉变量别名 ─────────────────────────────────────
     关键机制：`--muted: var(--sk-muted)` 这类别名是在**声明它的那个元素**上做
