name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (src ↔ modules ↔ courses.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify src/ packs to modules/ unchanged
        run: node tools/verify-pack.js

      - name: Verify courses.js matches the repo (keys, size, tags, total, unique ids)
        run: node tools/check-courses.js

      - name: Verify theme tokens (--sk-*/--ilq-* paired, skin has no hardcoded colors)
        run: node tools/check-theme.js

      # 两遍量：读者当前看得见的先量，折叠面板 / <details> / [hidden] 里的揭开后补量，
      # 并给覆盖率设 90% 下限——"0 失败"只有配上"量到了多少"才有意义。
      # 除 46 个模块外还量导航页（带一份确定性学习进度，否则进度条/徽章根本不渲染）。
      - name: Contrast audit (46 modules + nav x 2 themes, coverage >= 90%; SKIPs when no browser is available)
        run: |
          test -f package.json || npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright >/dev/null 2>&1 \
            || echo "playwright 安装失败 → tools/check-contrast.js 将 SKIP"
          npx playwright install chromium >/dev/null 2>&1 \
            || echo "chromium 下载失败 → tools/check-contrast.js 将 SKIP"
          node tools/check-contrast.js

      # 触控地板写在 skin 里（三组 min-height / !important 规则），任何一次模块改版
      # 都可能悄悄顶掉它，而"手机上点不准"在桌面预览里完全看不出来。
      # playwright/chromium 若在上一步已装好就在这里复用，没装成则 SKIP + exit 0。
      - name: Tap target audit (46 modules @ 390x844 touch viewport)
        run: node tools/check-tap.js

  github-pages:
    name: GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Clean stale artifacts
        run: |
          ids=$(gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts?name=github-pages --jq '.artifacts[].id' 2>/dev/null)
          for id in $ids; do
            gh api --method DELETE repos/"$GITHUB_REPOSITORY"/actions/artifacts/"$id" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=iroqi
