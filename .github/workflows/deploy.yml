name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (src ↔ modules ↔ courses.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify src/ packs to modules/ unchanged
        run: node tools/verify-pack.js

      - name: Verify courses.js matches the repo (keys, size, tags, total, unique ids)
        run: node tools/check-courses.js

      - name: Verify theme tokens (--sk-*/--ilq-* paired, skin has no hardcoded colors)
        run: node tools/check-theme.js

  # 三道要开浏览器的闸门各跑各的 job，用 matrix 并列。
  # 为什么拆开：CI 实测三个 job 的时长 contrast 431s、behavior 295s、tap 105s（各含自己的
  # checkout + setup-node + 装浏览器），串在一个 job 里是 13m51s；拆成并发后墙钟由最慢的那
  # 条决定，约 7m15s。本地单趟则是 contrast 392s / behavior 264s / tap 67s。
  # 为什么不合并成一道：三个判据量的是
  # 对比度、触控地板、点击后果——合并后一次红灯要说清三本账，判据之间还会互相
  # 借道（答题 pass 的点击会改变对比度 pass 的可见 DOM），各自独立失败才各自可解释。
  # 装不上 playwright / chromium 时三道闸门都 SKIP + exit 0（判据不能把"环境没有浏览器"
  # 说成"库有病"），所以这里每一步都允许安装失败，让 gate 自己决定是 SKIP 还是 FAIL。
  browser:
    name: Browser gate (${{ matrix.gate }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [contrast, tap, behavior]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install a browser (failure here means SKIP, not red)
        run: |
          test -f package.json || npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund playwright >/dev/null 2>&1 \
            || echo "playwright 安装失败 → 浏览器类闸门将 SKIP"
          npx playwright install chromium >/dev/null 2>&1 \
            || echo "chromium 下载失败 → 浏览器类闸门将 SKIP"

      # 两遍量：读者当前看得见的先量，折叠面板 / <details> / [hidden] 里的揭开后补量，
      # 并给覆盖率设 90% 下限——"0 失败"只有配上"量到了多少"才有意义。
      # 除 46 个模块外还量导航页（带一份确定性学习进度，否则进度条/徽章根本不渲染）。
      - name: Contrast audit (46 modules + nav x 2 themes, coverage >= 90%)
        if: matrix.gate == 'contrast'
        run: node tools/check-contrast.js

      # 触控地板写在 skin 里（三组 min-height / !important 规则），任何一次模块改版
      # 都可能悄悄顶掉它，而"手机上点不准"在桌面预览里完全看不出来。
      - name: Tap target audit (46 modules @ 390x844 touch viewport)
        if: matrix.gate == 'tap'
        run: node tools/check-tap.js

      # 前面几道闸门量的都是"界面长什么样"。这一道量"读者点下去会发生什么"：
      # 逐模块遍历点击与键入，再切到下一个模块静置 1.5s——模块回收后仍在跑的
      # 定时器会在这段静置里报错（Round 20 实测 81 条，四道闸门当时全绿）。
      # 顺带钉住整站最核心的那条路：每个模块的测验都要被真答完并在 il_progress 留下成绩
      # （46/46，缺一即红）；再加全档案回环——备份里每个键逐字节回来，六类非法输入不得覆盖。
      # Round 22 起还多走一趟"第二次进入"：错题优先重排、记录不被改写、逐题判定对得上账。
      - name: Behavior audit (46 modules click-through + quiz answered + revisit + post-release leak + archive roundtrip)
        if: matrix.gate == 'behavior'
        run: node tools/check-behavior.js

  github-pages:
    name: GitHub Pages
    needs: [check, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Clean stale artifacts
        run: |
          ids=$(gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts?name=github-pages --jq '.artifacts[].id' 2>/dev/null)
          for id in $ids; do
            gh api --method DELETE repos/"$GITHUB_REPOSITORY"/actions/artifacts/"$id" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-pages:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=iroqi
